<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORA IPTV - My TV</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b10;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
button,input{font-family:Arial,sans-serif}
button{cursor:pointer;outline:none}
button:focus,.item:focus,.category:focus{outline:3px solid #e7b85c;outline-offset:2px}

/* Header Top Bar */
.header{height:80px;background:linear-gradient(to bottom, rgba(16,19,27,0.9), rgba(9,11,16,0.9));display:flex;align-items:center;justify-content:space-between;padding:0 3%;position:sticky;top:0;z-index:10;border-bottom:1px solid #252a36;}
.logo-area{display:flex;align-items:center;gap:15px;font-size:28px;font-weight:bold;color:#fff;}
.logo-area svg{color:#f2b01e;}
.top-info{display:flex;align-items:center;gap:20px;font-size:18px;color:#ddd;}
.top-icons{display:flex;gap:20px;font-size:24px;color:#ccc;}
.top-icons svg:hover{color:#f2b01e;cursor:pointer;}

/* Toolbar */
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:15px 3%;gap:15px;flex-wrap:wrap;}
.toolbar-left{display:flex;gap:15px;flex-wrap:wrap;}
.btn-circle{width:60px;height:60px;border-radius:15px;border:1px solid #334;background:#1a2235;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;gap:5px;transition:0.3s;}
.btn-circle svg{width:24px;height:24px;}
.btn-circle:hover,.btn-circle:focus{background:#2a3755;border-color:#f2b01e;color:#f2b01e;}
.btn-circle.primary{background:#1f3b73;border-color:#3a6bc4;}
.btn-circle.purple{background:#3b1f73;border-color:#6b3ac4;}

.toolbar-right{display:flex;align-items:center;gap:15px;font-size:20px;color:#fff;}
.btn-pill{background:#1f3b73;color:#fff;border:1px solid #3a6bc4;padding:10px 25px;border-radius:30px;font-size:16px;display:flex;align-items:center;gap:10px;transition:0.3s;}
.btn-pill:hover,.btn-pill:focus{background:#2a4d99;border-color:#f2b01e;}
.btn-pill.purple{background:#3b1f73;border-color:#6b3ac4;}
.btn-pill.purple:hover{background:#4d2a99;border-color:#f2b01e;}
.page-info{color:#fff;font-size:18px;font-weight:bold;}

/* Content Grid */
.page{padding:10px 3% 50px;}
.grid{width:100%;font-size:0;text-align:right;display:flex;flex-wrap:wrap;gap:1.5%;}

.item{
 position:relative;
 width:15.5%;
 margin-bottom:25px;
 background:#141923;
 border:3px solid transparent;
 border-radius:12px;
 overflow:hidden;
 cursor:pointer;
 color:#fff;
 text-align:center;
 transition:0.3s;
 display:flex;
 flex-direction:column;
}
.item:hover,.item:focus{border-color:#f2b01e;box-shadow:0 0 15px rgba(242,176,30,0.4);transform:scale(1.02);}

.poster-wrapper{position:relative;width:100%;height:230px;overflow:hidden;border-radius:8px 8px 0 0;}
.poster{width:100%;height:100%;object-fit:cover;background:#222b39;}

/* Progress Bar */
.progress-container{position:absolute;bottom:0;left:0;right:0;height:6px;background:rgba(255,255,255,0.2);}
.progress-fill{height:100%;background:#f2b01e;width:0%;}

/* Favorite Star */
.fav-star{position:absolute;top:8px;left:8px;color:#f2b01e;background:rgba(0,0,0,0.6);border-radius:50%;padding:6px;z-index:2;display:flex;align-items:center;justify-content:center;}
.fav-star svg{width:20px;height:20px;}

/* Play Icon */
.play-icon{position:absolute;bottom:10px;right:10px;width:36px;height:36px;background:rgba(0,0,0,0.7);border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2;}

.item-info{padding:12px 8px;background:#141923;}
.item-name-ar{font-size:16px;font-weight:bold;color:#fff;margin:0 0 5px 0;}
.item-name-en{font-size:12px;color:#f2b01e;margin:0;text-transform:uppercase;}

@media(max-width:1200px){.item{width:23.5%;}}
@media(max-width:800px){.item{width:32%;}.toolbar{flex-direction:column;align-items:flex-start;}}
@media(max-width:500px){.item{width:48%;}}

/* Modals & Player (Keep from original) */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at center,#202938,#090b10 70%)}
.login{width:100%;max-width:430px;background:#141923;border:1px solid #303746;border-radius:12px;padding:35px}
.login h1{text-align:center;color:#e7b85c;letter-spacing:3px}
.login p{text-align:center;color:#9da5b5}
.field{margin:15px 0}
.field label{display:block;color:#aab1c0;font-size:13px;margin-bottom:8px}
.field input{width:100%;padding:13px;background:#090d15;color:white;border:1px solid #343d4c;border-radius:5px;font-size:15px}
.login button{width:100%;margin-top:15px}
#message{color:#ff8585;font-size:13px;margin-top:15px;text-align:center}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:#070b14;z-index:30;display:none;align-items:stretch;justify-content:center;padding:0}
.modal{width:100%;height:100%;overflow:hidden;background:transparent;padding:0}
#playerLayer{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:50;align-items:center;justify-content:center}
#video{position:fixed;top:0;left:0;width:100vw;height:100vh;margin:0;padding:0;object-fit:contain;background:#000}
.osd{position:absolute;left:0;right:0;z-index:3;transition:opacity .3s}
#playerLayer.hide .osd{opacity:0}
#playerLayer.hide{cursor:none}
.osd-top{top:0;padding:18px 3% 50px;background:linear-gradient(rgba(0,0,0,.88),rgba(0,0,0,0));display:flex;align-items:center;justify-content:space-between}
.top-left{display:flex;align-items:center;font-size:20px;color:#eee;white-space:nowrap}
.top-left .sep{width:1px;height:30px;background:rgba(255,255,255,.35);margin:0 18px}
.top-right{display:flex;align-items:center;direction:rtl;min-width:0}
.brand{display:flex;align-items:center;color:#f2b01e;font-size:30px;font-weight:bold;margin-left:18px}
#playingTitle{font-size:22px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
#liveBadge{display:none;background:#d33;color:#fff;font-size:12px;font-weight:bold;padding:3px 9px;border-radius:4px;margin-right:12px}
.osd-sub{top:105px;text-align:center;font-size:40px;font-weight:bold;color:#fff;text-shadow:0 2px 12px #000,0 0 4px #000;padding:0 6%;direction:rtl;line-height:1.4}
.osd-bottom{bottom:0;padding:60px 3% 22px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.9))}
.osd-bar-row{display:flex;align-items:center;direction:ltr}
#timeCur,#timeTot{font-size:22px;font-weight:bold;color:#fff;min-width:78px;white-space:nowrap}
#timeCur{text-align:left;margin-right:14px}
#timeTot{text-align:right;margin-left:14px}
.bar{position:relative;flex:1;height:6px;background:rgba(255,255,255,.3);border-radius:3px;cursor:pointer}
.bar div{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px}
#barBuf{background:rgba(255,255,255,.35)}
#barPos{background:#f2b01e}
#barKnob{top:50%;bottom:auto;width:20px;height:20px;border-radius:50%;background:#f2b01e;margin:-10px 0 0 -10px;box-shadow:0 0 10px rgba(242,176,30,.9)}
.ctl-row{display:flex;align-items:center;direction:ltr;margin-top:20px}
.ctl-side{flex:1;display:flex}
.ctl-main{display:flex;align-items:center}
.cbtn{width:78px;height:62px;padding:0;margin:0 6px;border-radius:28px;border:1px solid rgba(255,255,255,.25);background:rgba(70,70,76,.6);color:#fff}
.cbtn svg{display:block;margin:0 auto}
.cbtn-play{width:100px;height:100px;padding:0;margin:0 10px;border-radius:50%;border:5px solid #f2b01e;background:rgba(18,18,20,.88);color:#fff;box-shadow:0 0 24px rgba(242,176,30,.55)}
#buffering{display:none;position:absolute;top:50%;left:50%;margin:-30px 0 0 -30px;z-index:4}
.spinner{width:60px;height:60px;border:6px solid #ffffff33;border-top-color:#f2b01e;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#seekPop{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;background:rgba(0,0,0,.7);color:#fff;font-size:38px;padding:14px 34px;border-radius:14px}
#plPanel{display:none;position:absolute;top:0;right:0;bottom:0;width:34%;min-width:300px;background:rgba(8,10,16,.95);border-left:1px solid #333;z-index:8;direction:rtl}
#plTitle{font-size:22px;font-weight:bold;color:#f2b01e;padding:22px 20px 14px}
#plBody{position:absolute;top:66px;left:0;right:0;bottom:10px;overflow-y:auto;padding:0 16px}
.pl-item{padding:14px 16px;margin:6px 0;border-radius:8px;background:#1c2230;color:#fff;font-size:17px;cursor:pointer;text-align:right}
.dp{position:relative;width:100%;height:100%;overflow:hidden;color:#fff;direction:rtl;background:#070b14}
.dp-bg{position:absolute;top:0;left:0;right:0;bottom:0;background-size:cover;background-position:center;opacity:.4}
.dp-shade{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,rgba(7,11,20,.95),rgba(7,11,20,.72) 55%,rgba(7,11,20,.93))}
.dp-top{position:relative;height:9vh;padding:0 3vw;display:flex;align-items:center;justify-content:space-between}
.dp-main{position:relative;display:flex;height:91vh;padding:1vh 3vw 2vh}
.dp-right{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.dp-left{width:22vw;flex:none;margin-right:3vw;display:flex;flex-direction:column}
.dp-poster{flex:1;display:flex;align-items:center;justify-content:center}
.dp-poster img{max-width:100%;max-height:100%;object-fit:contain;border-radius:1.6vh;border:2px solid rgba(120,150,255,.55);background:#101626}
.dbtn{display:flex;direction:rtl;align-items:center;justify-content:center;width:100%;height:5.8vh;margin-top:.9vh;border-radius:3vh;border:2px solid rgba(110,130,255,.55);background:rgba(28,38,86,.92);color:#fff;font-size:2.3vh;cursor:pointer}
.dbtn.gold{border-color:#f2b01e;background:rgba(54,44,18,.94)}
.dp-title{margin:0;font-size:5.6vh;font-weight:bold;line-height:1.25;overflow:hidden;white-space:nowrap}
.dp-meta{display:flex;flex-wrap:wrap;align-items:center;font-size:2.5vh;color:#e6e9f2;margin:.8vh 0 1.2vh}
.dp-meta .gold{color:#f2b01e;font-weight:bold}
.dp-box{border:1px solid rgba(120,150,255,.45);border-radius:1.4vh;background:rgba(14,20,44,.72);padding:1.1vh 1.6vw}
.dp-box h3{margin:0 0 .5vh;font-size:3vh;color:#f2b01e}
.dp-box p{margin:0;font-size:2.4vh;line-height:1.55;color:#e4e8f2}
.dp-sec{font-size:3vh;color:#f2b01e;font-weight:bold;margin:1.4vh 0 .6vh}
.dp-seasons{display:flex;flex-wrap:wrap;margin-bottom:.4vh}
.chip{margin-left:.8vw;padding:.7vh 1.4vw;border-radius:3vh;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.08);color:#fff;font-size:2.1vh;cursor:pointer}
.chip.on{background:#f2b01e;border-color:#f2b01e;color:#111;font-weight:bold}
.dp-eps{display:flex;overflow-x:auto;padding:.8vh .4vw 1.4vh}
.ep{position:relative;width:25vh;height:19vh;margin-left:1.3vw;flex:none;border-radius:1.6vh;overflow:hidden;border:2px solid rgba(160,120,255,.5);background:#0d1226;cursor:pointer}
.ep img{width:100%;height:100%;object-fit:cover}
.ep-info{position:absolute;bottom:0;left:0;right:0;padding:3.5vh 1vh 2.3vh;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.94));display:flex;align-items:center;justify-content:space-between}
.ep-txt{min-width:0;font-size:2.1vh;text-align:right}
.ep-txt b{display:block;color:#fff}
.ep-txt span{display:block;color:#f2b01e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="app"></div>

<!-- Modal for Details -->
<div class="modal-bg" id="modalBg">
 <div class="modal" id="modal"></div>
</div>

<!-- Player Layer -->
<div id="playerLayer">
 <video id="video" autoplay></video>
 <div id="buffering"><div class="spinner"></div></div>
 <div id="seekPop"></div>

 <div class="osd osd-top">
  <div class="top-left"><span id="clockDate"></span><span class="sep"></span><span id="clockText"></span></div>
  <div class="top-right">
   <div class="brand"><svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4.2c0-1 1.1-1.6 2-1.1l12 7.1c.9.5.9 1.7 0 2.2L8 19.5c-.9.5-2 0-2-1.1z"/></svg> My TV</div>
   <span id="playingTitle">MORA IPTV</span><span id="liveBadge">LIVE</span>
  </div>
 </div>
 <div class="osd osd-sub" id="subTitle"></div>

 <div class="osd osd-bottom">
  <div class="osd-bar-row">
   <span id="timeCur">00:00</span>
   <div class="bar" id="barWrap" onclick="barClick(event)"><div id="barBuf"></div><div id="barPos"></div><div id="barKnob"></div></div>
   <span id="timeTot">00:00</span>
  </div>
  <div class="ctl-row">
   <div class="ctl-side"><button class="cbtn" onclick="openPanel('list')"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg></button></div>
   <div class="ctl-main">
    <button class="cbtn" onclick="stepSeek(-1)"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6zM21.5 18V6L13 12z"/></svg></button>
    <button class="cbtn" onclick="jumpBy(-10)"><svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg></button>
    <button class="cbtn-play" id="btnPlay" onclick="togglePlay()"></button>
    <button class="cbtn" onclick="jumpBy(10)"><svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg></button>
    <button class="cbtn" onclick="stepSeek(1)"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M2.5 18l8.5-6-8.5-6zM13 6v12l8.5-6z"/></svg></button>
   </div>
   <div class="ctl-side" style="justify-content:flex-end;">
    <button class="cbtn" onclick="nextItem(-1)"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
    <button class="cbtn" onclick="nextItem(1)"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg></button>
    <button class="cbtn" onclick="closePlayer()"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg></button>
   </div>
  </div>
 </div>
 <div id="plPanel"><div id="plTitle"></div><div id="plBody"></div></div>
</div>

<script>
(function(){
var app = document.getElementById("app");
var modalBg = document.getElementById("modalBg");
var modal = document.getElementById("modal");
var video = document.getElementById("video");

var SERVER="", USER="", PASS="";
var PAGE="home", SECTION="", CATEGORY_ID="", CATEGORY_NAME="";
var CATEGORIES=[], CONTENT=[], LIVE=[], MOVIES=[], SERIES=[];
var FAVORITES=[], HISTORY=[];
var CURRENT=null, CURRENT_PAGE=1, PAGE_SIZE=12, SEARCH="";
var LAST_FOCUS=null, MODAL_OPENER=null, EPISODES=[];
var SPROG={}, PANEL="", LIST_KIND="";
var DINFO=null, DSEASON=0, SEASONS=[], DERR=false, LISTS_DIRTY=false, OPENER_IDX=-1;
var seekCount=0, scanDir=0, seekTarget=null, seekTimer=null;
var SCAN_TICK=1000, osdTimer=null, popTimer=null, lastPosSave=0, POS={};
var PLAYER={live:false, key:"", epIndex:-1, liveId:""};
var connected=false;
var requestToken=0;
var RENDERED_ITEMS={}, RENDERED_COUNTER=0;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function loadSaved(){
 try { FAVORITES = JSON.parse(localStorage.getItem("mora_favorites") || "[]"); HISTORY = JSON.parse(localStorage.getItem("mora_history") || "[]"); } catch(e){ FAVORITES = []; HISTORY = []; }
}
function saveLists(){
 LISTS_DIRTY = true;
 try { localStorage.setItem("mora_favorites", JSON.stringify(FAVORITES)); localStorage.setItem("mora_history", JSON.stringify(HISTORY)); } catch(e){}
}
function credentialsSaved(){
 try { SERVER = localStorage.getItem("mora_server") || ""; USER = localStorage.getItem("mora_user") || ""; PASS = localStorage.getItem("mora_pass") || ""; } catch(e){}
}
function apiUrl(action, extra){
 var url = SERVER.replace(/\/+$/, "");
 return url + "/player_api.php?username=" + encodeURIComponent(USER) + "&password=" + encodeURIComponent(PASS) + (action ? "&action=" + action : "") + (extra || "");
}
function request(url, callback){
 var xhr = new XMLHttpRequest();
 xhr.open("GET", url, true);
 xhr.timeout = 20000;
 xhr.onreadystatechange = function(){
  if(xhr.readyState === 4){
   if(xhr.status >= 200 && xhr.status < 300){ try { callback(null, JSON.parse(xhr.responseText)); } catch(e) { callback("استجابة غير مفهومة"); } }
   else callback("تعذر الاتصال (" + xhr.status + ")");
  }
 };
 xhr.onerror = function(){ callback("حدث خطأ في الاتصال"); };
 xhr.ontimeout = function(){ callback("انتهت مهلة الاتصال"); };
 xhr.send();
}

// Login View
function showLogin(error){
 connected = false;
 app.innerHTML = '<div class="login-wrap"><div class="login"><h1>MORA IPTV</h1><p>YOUR ENTERTAINMENT WORLD</p>' +
  '<div class="field"><label>Server URL</label><input id="serverInput" placeholder="http://example.com:8080" value="'+esc(SERVER)+'"></div>' +
  '<div class="field"><label>Username</label><input id="userInput" value="'+esc(USER)+'"></div>' +
  '<div class="field"><label>Password</label><input id="passInput" type="password" value="'+esc(PASS)+'"></div>' +
  '<button class="primary" onclick="connect()" style="background:#f2b01e;color:#000;font-weight:bold;border-radius:5px;padding:12px;border:none;">اتصال</button>' +
  '<div id="message">'+esc(error || "أدخل بيانات الاشتراك")+'</div></div></div>';
}

window.connect = function(){
 var s = $("serverInput"), u = $("userInput"), p = $("passInput");
 if(s){ SERVER = s.value.replace(/\/+$/, ""); USER = u.value; PASS = p.value; }
 if(!SERVER || !USER || !PASS){ showLogin("من فضلك أدخل جميع البيانات"); return; }
 if($("message")) $("message").innerHTML = "جاري الاتصال...";
 request(apiUrl(""), function(err, data){
  if(err || !data || !data.user_info || Number(data.user_info.auth) !== 1){ showLogin(err || "بيانات غير صحيحة"); return; }
  try { localStorage.setItem("mora_server", SERVER); localStorage.setItem("mora_user", USER); localStorage.setItem("mora_pass", PASS); } catch(e){}
  connected = true; PAGE = "home"; render();
 });
};

// Main Render
function render(){
 RENDERED_ITEMS = {}; RENDERED_COUNTER = 0;
 if(!connected){ showLogin(); return; }
 var html = "";
 if(PAGE === "home"){ html = renderHome(); }
 else if(PAGE === "categories"){ html = renderCategories(); }
 else if(PAGE === "content"){ html = renderContent(); }
 else if(PAGE === "settings"){ html = renderSettings(); }
 app.innerHTML = headerHTML() + '<div class="page">' + html + '</div>';
}

// Top Header
function headerHTML(){
 return '<div class="header">' +
  '<div class="logo-area"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4.2c0-1 1.1-1.6 2-1.1l12 7.1c.9.5.9 1.7 0 2.2L8 19.5c-.9.5-2 0-2-1.1z"/></svg> My TV</div>' +
