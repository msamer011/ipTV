<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 250px;
            background-color: #1f1f1f;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .menu-item {
            padding: 15px;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }
        .menu-item.active, .menu-item:focus {
            background-color: #333;
            outline: none;
        }
        #content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }
        .item-card {
            background-color: #2c2c2c;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            text-align: center;
        }
        .item-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .item-card h3 {
            margin: 10px 0;
            font-size: 16px;
        }
        #settings-form {
            display: flex;
            flex-direction: column;
            max-width: 400px;
        }
        input {
            padding: 10px;
            margin-bottom: 10px;
            background-color: #333;
            border: 1px solid #444;
            color: #fff;
        }
        button {
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="sidebar" role="navigation">
        <div class="menu-item active" tabindex="0" onclick="showSection('live')">Live Channels</div>
        <div class="menu-item" tabindex="0" onclick="showSection('movies')">Movies</div>
        <div class="menu-item" tabindex="0" onclick="showSection('series')">Series</div>
        <div class="menu-item" tabindex="0" onclick="showSection('settings')">Settings</div>
    </div>

    <div id="content">
        <!-- Dynamic content will load here -->
    </div>

    <script>
        function showSection(section) {
            const content = document.getElementById('content');
            const menuItems = document.querySelectorAll('.menu-item');
            
            menuItems.forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');

            content.innerHTML = '';

            if (section === 'live') {
                loadCategories('live');
            } else if (section === 'movies') {
                loadCategories('movies');
            } else if (section === 'series') {
                loadCategories('series');
            } else if (section === 'settings') {
                loadSettings();
            }
        }

        function loadCategories(type) {
            const content = document.getElementById('content');
            const categories = ['Favorites', 'Continue Watching', 'All Categories'];
            
            categories.forEach(cat => {
                let div = document.createElement('div');
                div.className = 'menu-item';
                div.innerText = cat;
                div.tabIndex = 0;
                div.onclick = () => loadItems(type, cat);
                content.appendChild(div);
            });
        }

        function loadItems(type, category) {
            const content = document.getElementById('content');
            content.innerHTML = '';
            
            // Mock data for items
            for (let i = 1; i <= 10; i++) {
                let card = document.createElement('div');
                card.className = 'item-card';
                card.tabIndex = 0;
                card.innerHTML = `
                    <img src="via.placeholder.com/150x200" alt="Poster">
                    <h3>${type.toUpperCase()} ${i}</h3>
                `;
                content.appendChild(card);
            }
        }

        function loadSettings() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div id="settings-form">
                    <h2>Xtream Codes Login</h2>
                    <input type="text" placeholder="Server URL" id="url">
                    <input type="text" placeholder="Username" id="username">
                    <input type="password" placeholder="Password" id="password">
                    <button onclick="saveSettings()">Save</button>
                </div>
            `;
        }

        function saveSettings() {
            alert('Settings Saved');
        }

        // Initialize
        showSection('live');
    </script>
</body>
</html>
