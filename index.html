<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORA IPTV</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b10;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
button,input{font-family:Arial,sans-serif}
button{cursor:pointer}
button:focus,.item:focus,.category:focus,.episode:focus{outline:3px solid #e7b85c;outline-offset:2px}
.header{height:76px;background:#10131b;display:flex;align-items:center;padding:0 3%;border-bottom:1px solid #252a36;position:sticky;top:0;z-index:10}
.logo{font-size:24px;font-weight:bold;letter-spacing:2px;color:#e7b85c;white-space:nowrap}
.logo small{display:block;font-size:9px;color:#aaa;letter-spacing:3px;margin-top:4px}
.nav{display:flex;gap:5px;margin-left:25px;flex:1}
.nav button{border:0;background:transparent;color:#aaa;padding:12px 13px;font-size:14px;border-radius:5px;white-space:nowrap}
.nav button.active,.nav button:focus{background:#252a36;color:#fff}
.page{padding:25px 3% 50px}
.primary{background:#d9a94e;color:#111;border:0;padding:12px 20px;border-radius:5px;font-weight:bold}
.secondary{background:#252c39;color:#fff;border:1px solid #394354;padding:10px 16px;border-radius:5px}
.section-title{font-size:21px;margin:20px 0}
.grid{
 width:100%;
 font-size:0;
 text-align:right;
}

.item{
 display:inline-block;
 vertical-align:top;
 width:15.5%;
 margin:0.4%;
 padding:0;
 font-size:14px;
 background:#141923;
 border:1px solid #252d3a;
 border-radius:7px;
 overflow:hidden;
 cursor:pointer;
 color:#fff;
 text-align:right;
}

.item:focus,.item:hover{
 border:2px solid #e7b85c;
}

.poster{
 display:block;
 width:100%;
 height:230px;
 object-fit:cover;
 background:#222b39;
}

.item-info{
 padding:8px;
}

.item-name{
 font-size:13px;
 line-height:1.4;
 height:36px;
 overflow:hidden;
}

.item-type{
 font-size:11px;
 color:#929bad;
 margin-top:5px;
}

@media(max-width:1000px){
 .item{width:24%}
 .poster{height:220px}
}

@media(max-width:700px){
 .item{width:32%}
 .poster{height:190px}
}
 
.item-info{padding:8px}
.item-name{font-size:13px;line-height:1.4;height:36px;overflow:hidden}
.item-type{font-size:11px;color:#929bad;margin-top:5px}
.empty{color:#9da5b5;text-align:center;padding:35px 10px;background:#131823;border-radius:8px}
.category-list{display:flex;flex-direction:column;gap:10px;max-width:650px;margin:20px auto}
.category{width:100%;padding:17px 20px;text-align:right;background:#171e2a;color:#eee;border:1px solid #303a49;border-radius:6px;font-size:17px}
.category:focus,.category:hover{background:#302a1e;border-color:#d9a94e}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#141923;border:1px solid #293242;padding:12px;border-radius:7px;margin-bottom:20px}
.toolbar-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar button{padding:10px 14px}
.toolbar input{background:#090d15;color:white;border:1px solid #343d4c;padding:10px;border-radius:5px;width:170px}
.page-count{color:#e7b85c;font-size:14px;white-space:nowrap}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at center,#202938,#090b10 70%)}
.login{width:100%;max-width:430px;background:#141923;border:1px solid #303746;border-radius:12px;padding:35px}
.login h1{text-align:center;color:#e7b85c;letter-spacing:3px}
.login p{text-align:center;color:#9da5b5}
.field{margin:15px 0}
.field label{display:block;color:#aab1c0;font-size:13px;margin-bottom:8px}
.field input{width:100%;padding:13px;background:#090d15;color:white;border:1px solid #343d4c;border-radius:5px;font-size:15px}
.login button{width:100%;margin-top:15px}
#message{color:#ff8585;font-size:13px;margin-top:15px;text-align:center}

/* ===== الصفحة الرئيسية (بدون بوسترات) ===== */
.hm{position:relative;min-height:100vh;padding:0 4vw 4vh;direction:rtl;color:#fff;background:radial-gradient(circle at 82% 6%,#18284a,rgba(7,11,20,0) 45%),radial-gradient(circle at 12% 62%,#131f3b,rgba(7,11,20,0) 50%),#070b14}
.hm-top{height:11vh;display:flex;align-items:center;justify-content:space-between;direction:ltr}
.hm-tools{display:flex;align-items:center;color:#d3daec;font-size:2.7vh;white-space:nowrap}
.hm-tools svg{width:3.6vh;height:3.6vh;margin-right:2vw;color:#cfd6e8}
.hm-sep{display:inline-block;width:2px;height:3vh;background:rgba(255,255,255,.45);margin:0 1.2vw}
.hm-date{direction:rtl;unicode-bidi:embed;display:inline-block}
.hm-logo{font-size:6vh;font-weight:bold;color:#f2b01e;letter-spacing:1px;text-shadow:0 0 2.5vh rgba(242,176,30,.5)}
.hm-banner{position:relative;height:31vh;border-radius:2.2vh;border:1px solid rgba(120,150,230,.35);overflow:hidden;background:linear-gradient(100deg,#0a1020 30%,#16284a 72%,#1d3160);padding:0 4vw;display:flex;flex-direction:column;justify-content:center}
.hm-banner:before{content:"";position:absolute;left:-6vw;top:-12vh;width:42vw;height:56vh;background:radial-gradient(circle,rgba(242,176,30,.2),rgba(242,176,30,0) 65%)}
.hm-bt{position:relative;font-size:5.2vh;font-weight:bold;margin:0 0 1.6vh}
.hm-bs{position:relative;font-size:3vh;color:#cdd5e8;margin:0}
.hm-watch{position:absolute;left:2.5vw;bottom:3.5vh;height:6.4vh;padding:0 2.6vw;border-radius:3.5vh;border:1px solid rgba(242,176,30,.65);background:rgba(60,48,26,.85);color:#fff;font-size:2.6vh;font-weight:bold}
.hm-watch:focus,.hm-watch:hover{outline:none;border:.35vh solid #f2b01e;box-shadow:0 0 2.4vh rgba(242,176,30,.75)}
.hm-dots{position:absolute;right:2.5vw;bottom:3.2vh;direction:ltr}
.hm-dots i{display:inline-block;width:1.2vh;height:1.2vh;border-radius:50%;background:rgba(255,255,255,.35);margin-left:1vh}
.hm-dots i.on{background:#fff}
.hm-tiles{display:flex;justify-content:space-between;margin-top:3.6vh;direction:rtl}
.hm-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;width:15.6%;height:31vh;margin:0;padding:0;border-radius:2.2vh;border:1px solid rgba(150,170,220,.3);background:linear-gradient(160deg,rgba(62,72,98,.75),rgba(14,21,38,.95));color:#fff;font-size:3.6vh;font-weight:bold}
.hm-tile:focus,.hm-tile:hover{outline:none;border:.4vh solid #f2b01e;background:linear-gradient(160deg,rgba(80,66,34,.8),rgba(24,22,18,.95));box-shadow:0 0 3.2vh rgba(242,176,30,.7)}
.hm-ic{display:block;height:13vh;margin-bottom:2.6vh}
.hm-ic svg{width:13vh;height:13vh}
.c-home{color:#f2b01e}.c-movies{color:#3d8bff}.c-series{color:#a35cff}.c-live{color:#2fd0e8}.c-radio{color:#ff4d79}.c-set{color:#aab2c4}
.hm-sec{font-size:3.4vh;font-weight:bold;margin:3.8vh 0 1.4vh}
.hm-cards{display:flex;overflow-x:auto;overflow-y:hidden;padding:1vh .6vw 1.4vh}
.hcard{flex:none;width:21vw;height:15vh;margin-left:1.4vw;border-radius:1.8vh;background:linear-gradient(160deg,#1c2640,#0e1424);border:1px solid rgba(150,170,220,.3);padding:1.6vh 1.4vw;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;color:#fff;text-align:right}
.hcard:focus,.hcard:hover{outline:none;border:.35vh solid #f2b01e;box-shadow:0 0 2.6vh rgba(242,176,30,.7)}
.hcard-n{font-size:2.8vh;line-height:1.3;max-height:7.4vh;overflow:hidden;font-weight:bold}
.hcard-f{display:flex;justify-content:space-between;font-size:2.2vh;color:#aab4cc}
.hcard-f b{color:#f2b01e}
.hm-empty{color:#8f98aa;font-size:2.4vh;padding:1.5vh .6vw}
/* ===== نهاية الصفحة الرئيسية ===== */

.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:#070b14;z-index:30;display:none;align-items:stretch;justify-content:center;padding:0}
.modal{width:100%;height:100%;max-width:none;max-height:none;overflow:hidden;background:transparent;border:0;border-radius:0;padding:0}
.modal-content{display:flex;gap:22px}
.modal-poster{width:180px;height:260px;object-fit:cover;background:#222}
.modal p{color:#aab1c0;line-height:1.6}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.episode{padding:13px;background:#242c3a;border-radius:5px;margin:8px 0;cursor:pointer}
#playerLayer{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:50;align-items:center;justify-content:center}
#video{position:fixed;top:0;left:0;width:100vw;height:100vh;margin:0;padding:0;object-fit:contain;background:#000}
.osd{position:absolute;left:0;right:0;z-index:3;-webkit-transition:opacity .3s;transition:opacity .3s}
#playerLayer.hide .osd{opacity:0}
#playerLayer.hide{cursor:none}
.osd-top{top:0;padding:18px 3% 50px;background:-webkit-linear-gradient(rgba(0,0,0,.88),rgba(0,0,0,0));background:linear-gradient(rgba(0,0,0,.88),rgba(0,0,0,0));direction:ltr;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between}
.top-left{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;font-size:20px;color:#eee;white-space:nowrap}
.top-left .sep{width:1px;height:30px;background:rgba(255,255,255,.35);margin:0 18px}
.top-right{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;direction:rtl;min-width:0}
.brand{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;color:#f2b01e;font-size:30px;font-weight:bold;letter-spacing:1px;direction:ltr;margin-left:18px}
.brand span{display:block;margin-right:8px}
#playingTitle{font-size:22px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
#liveBadge{display:none;background:#d33;color:#fff;font-size:12px;font-weight:bold;padding:3px 9px;border-radius:4px;margin-right:12px}
.osd-sub{top:105px;text-align:center;font-size:40px;font-weight:bold;color:#fff;text-shadow:0 2px 12px #000,0 0 4px #000;padding:0 6%;direction:rtl;line-height:1.4}
.osd-bottom{bottom:0;padding:60px 3% 22px;background:-webkit-linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.9));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.9))}
.osd-bar-row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;direction:ltr}
#timeCur,#timeTot{font-size:22px;font-weight:bold;color:#fff;min-width:78px;white-space:nowrap}
#timeCur{text-align:left;margin-right:14px}
#timeTot{text-align:right;margin-left:14px}
.bar{position:relative;-webkit-flex:1;flex:1;height:6px;background:rgba(255,255,255,.3);border-radius:3px;cursor:pointer}
.bar:after{content:"";position:absolute;left:0;right:0;top:-14px;bottom:-14px}
.bar div{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px}
#barBuf{background:rgba(255,255,255,.35)}
#barPos{background:#f2b01e}
.bar.seeking #barPos{background:#fff}
#barKnob{top:50%;bottom:auto;width:20px;height:20px;border-radius:50%;background:#f2b01e;margin:-10px 0 0 -10px;box-shadow:0 0 10px rgba(242,176,30,.9)}
.bar.seeking #barKnob{background:#fff}
.ctl-row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;direction:ltr;margin-top:20px}
.ctl-side{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex}
.ctl-left{-webkit-justify-content:flex-start;justify-content:flex-start}
.ctl-right{-webkit-justify-content:flex-end;justify-content:flex-end}
.ctl-main{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.cbtn{width:78px;height:62px;padding:0;margin:0 6px;border-radius:28px;border:1px solid rgba(255,255,255,.25);background:rgba(70,70,76,.6);color:#fff}
.cbtn-wide{width:100px}
.cbtn:hover,.cbtn:focus{background:rgba(242,176,30,.38);border-color:#f2b01e;outline:none}
.cbtn svg{display:block;margin:0 auto}
.cbtn-play{width:100px;height:100px;padding:0;margin:0 10px;border-radius:50%;border:5px solid #f2b01e;background:rgba(18,18,20,.88);color:#fff;box-shadow:0 0 24px rgba(242,176,30,.55)}
.cbtn-play:hover,.cbtn-play:focus{outline:none;box-shadow:0 0 34px rgba(242,176,30,.95)}
.cbtn-play svg{display:block;margin:0 auto}
.osd-hint{text-align:center;color:#8f98aa;font-size:12px;margin-top:14px;line-height:1.7;direction:rtl}
#plPanel{display:none;position:absolute;top:0;right:0;bottom:0;width:34%;max-width:480px;min-width:300px;background:rgba(8,10,16,.95);border-left:1px solid #333;z-index:8;direction:rtl}
#plTitle{font-size:22px;font-weight:bold;color:#f2b01e;padding:22px 20px 14px}
#plBody{position:absolute;top:66px;left:0;right:0;bottom:10px;overflow-y:auto;padding:0 16px}
.pl-item{padding:14px 16px;margin:6px 0;border-radius:8px;background:#1c2230;color:#fff;font-size:17px;line-height:1.5;cursor:pointer;text-align:right}
.pl-item.cur{border:1px solid #f2b01e}
.pl-item:focus,.pl-item:hover{outline:3px solid #f2b01e;outline-offset:0;background:#2a3042}
#buffering{display:none;position:absolute;top:50%;left:50%;margin:-30px 0 0 -30px;z-index:4}
.spinner{width:60px;height:60px;border:6px solid #ffffff33;border-top-color:#f2b01e;border-radius:50%;-webkit-animation:spin 1s linear infinite;animation:spin 1s linear infinite}
@-webkit-keyframes spin{to{-webkit-transform:rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
#seekPop{display:none;position:absolute;top:50%;left:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);z-index:5;background:rgba(0,0,0,.7);color:#fff;font-size:38px;padding:14px 34px;border-radius:14px;white-space:nowrap}
#seekPop svg{display:inline-block;vertical-align:middle;margin:0 10px}
#seekPop span{direction:ltr;unicode-bidi:embed;display:inline-block;vertical-align:middle}
.episode.last{border:1px solid #f2b01e}
.episode.last:after{content:"  (آخر مشاهدة)";color:#f2b01e;font-size:12px}
.category.special{border-color:#6b5a2e;background:#221d12}
.dp{position:relative;width:100%;height:100%;overflow:hidden;color:#fff;direction:rtl;background:#070b14}
.dp-bg{position:absolute;top:0;left:0;right:0;bottom:0;background-size:cover;background-position:center;opacity:.4}
.dp-shade{position:absolute;top:0;left:0;right:0;bottom:0;background:-webkit-linear-gradient(left,rgba(7,11,20,.95),rgba(7,11,20,.72) 55%,rgba(7,11,20,.93));background:linear-gradient(90deg,rgba(7,11,20,.95),rgba(7,11,20,.72) 55%,rgba(7,11,20,.93))}
.dp-top{position:relative;height:9vh;padding:0 3vw;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between}
.dp-brand{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;color:#f2b01e;font-size:4vh;font-weight:bold;letter-spacing:1px;direction:ltr}
.dp-brand span{margin-left:1vh}
.dp-clock{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;direction:ltr;font-size:2.6vh;color:#eee;white-space:nowrap}
.dp-sep{display:inline-block;width:1px;height:2.6vh;background:rgba(255,255,255,.4);margin:0 1.4vw}
.dp-main{position:relative;display:-webkit-flex;display:flex;height:91vh;padding:1vh 3vw 2vh}
.dp-right{-webkit-flex:1;flex:1;min-width:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;overflow:hidden}
.dp-left{width:22vw;-webkit-flex:none;flex:none;margin-right:3vw;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;overflow:hidden}
.dp-poster{-webkit-flex:1;flex:1;min-height:0;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;margin-bottom:.4vh}
.dp-poster img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:1.6vh;border:2px solid rgba(120,150,255,.55);background:#101626}
.dp-poster-fb{width:23.6vh;height:35vh;border-radius:1.6vh;border:2px solid rgba(120,150,255,.55);background:-webkit-linear-gradient(#232c52,#0e1326);background:linear-gradient(#232c52,#0e1326);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center;padding:2vh;font-size:3vh;font-weight:bold;line-height:1.3;overflow:hidden}
.dp-actions{margin-top:1vh}
.dbtn{display:-webkit-flex;display:flex;direction:rtl;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;width:100%;height:5.8vh;margin-top:.9vh;padding:0 1vh;border-radius:3vh;border:2px solid rgba(110,130,255,.55);background:rgba(28,38,86,.92);color:#fff;font-size:2.3vh;cursor:pointer;overflow:hidden;white-space:nowrap}
.dbtn svg{-webkit-flex:none;flex:none;margin-left:1vh}
.dbtn span{overflow:hidden;text-overflow:ellipsis}
.dbtn.gold{border-color:#f2b01e;background:rgba(54,44,18,.94)}
.dbtn:hover,.dbtn:focus{outline:none;border-color:#f2b01e;background:rgba(98,74,18,.95);box-shadow:0 0 14px rgba(242,176,30,.75)}
.dp-title{margin:0;font-size:5.6vh;font-weight:bold;line-height:1.25;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dp-meta{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-align-items:center;align-items:center;font-size:2.5vh;color:#e6e9f2;margin:.8vh 0 1.2vh;min-height:3vh}
.dp-meta .gold{color:#f2b01e;font-weight:bold}
.dp-meta svg{vertical-align:middle;color:#f2b01e;margin-right:.5vh}
.dp-box{border:1px solid rgba(120,150,255,.45);border-radius:1.4vh;background:rgba(14,20,44,.72);padding:1.1vh 1.6vw;-webkit-flex:none;flex:none}
.dp-box h3{margin:0 0 .5vh;font-size:3vh;color:#f2b01e}
.dp-box p{margin:0;font-size:2.4vh;line-height:1.55;color:#e4e8f2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dp-sec{font-size:3vh;color:#f2b01e;font-weight:bold;margin:1.4vh 0 .6vh}
.dp-cast{display:-webkit-flex;display:flex;overflow:hidden;height:16vh;-webkit-flex:none;flex:none}
.cast-i{width:13vh;margin-left:1.8vw;text-align:center;font-size:2vh;color:#e8ebf4;-webkit-flex:none;flex:none}
.cast-av{position:relative;overflow:hidden;width:9.4vh;height:9.4vh;border-radius:50%;border:2px solid rgba(140,160,255,.7);display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;margin:0 auto .6vh;font-size:3.4vh;font-weight:bold;color:#fff;direction:ltr}
.cast-av img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.cast-n{line-height:1.25;max-height:2.6em;overflow:hidden;word-wrap:break-word}
.dp-seasons{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-bottom:.4vh}
.chip{margin-left:.8vw;padding:.7vh 1.4vw;border-radius:3vh;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.08);color:#fff;font-size:2.1vh;cursor:pointer}
.chip.on{background:#f2b01e;border-color:#f2b01e;color:#111;font-weight:bold}
.chip:hover,.chip:focus{outline:none;box-shadow:0 0 12px rgba(242,176,30,.85);border-color:#f2b01e}
.dp-eps{display:-webkit-flex;display:flex;overflow-x:auto;overflow-y:hidden;padding:.8vh .4vw 1.4vh;-webkit-flex:none;flex:none}
.ep{position:relative;width:25vh;height:19vh;margin-left:1.3vw;-webkit-flex:none;flex:none;border-radius:1.6vh;overflow:hidden;border:2px solid rgba(160,120,255,.5);background:-webkit-linear-gradient(#1b2347,#0d1226);background:linear-gradient(#1b2347,#0d1226);cursor:pointer}
.ep img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.ep.last{border-color:#f2b01e}
.ep:hover,.ep:focus{outline:none;border-color:#f2b01e;box-shadow:0 0 18px rgba(242,176,30,.9)}
.ep-info{position:absolute;bottom:0;left:0;right:0;padding:3.5vh 1vh 2.3vh;background:-webkit-linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.94));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.94));display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between}
.ep-txt{min-width:0;font-size:2.1vh;line-height:1.35}

<body>
<div id="app"></div>

<div class="modal-bg" id="modalBg">
 <div class="modal" id="modal"></div>
</div>

<div id="trailerLayer"><button class="dbtn" onclick="closeTrailer()">إغلاق الإعلان</button><iframe id="trailerFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>

<div id="playerLayer">
 <video id="video" autoplay></video>
 <div id="buffering"><div class="spinner"></div></div>
 <div id="seekPop"></div>

 <div class="osd osd-top">
  <div class="top-left"><span id="clockDate"></span><span class="sep"></span><span id="clockText"></span></div>
  <div class="top-right">
   <div class="brand"><span data-icon="logo" data-size="36"></span>MORA IPTV</div>
   <span id="playingTitle">MORA IPTV</span><span id="liveBadge">LIVE</span>
  </div>
 </div>
 <div class="osd osd-sub" id="subTitle"></div>

 <div class="osd osd-bottom">

   <div class="ctl-main">

    <button class="cbtn cbtn-wide" data-icon="back10" data-size="36" onclick="jumpBy(-10)"></button>
    <button class="cbtn-play" id="btnPlay" onclick="togglePlay()"></button>
    <button class="cbtn cbtn-wide" data-icon="fwd10" data-size="36" onclick="jumpBy(10)"></button>

   </div>
   <div class="ctl-side ctl-right">

    <button class="cbtn" data-icon="next" data-size="28" onclick="nextItem(1)"></button>

  <div class="osd-hint">يمين / يسار: تقديم وتأخير مستمر (5 &middot; 10 &middot; 20 &middot; 60 &middot; 120 &middot; 300 ثانية كل ثانية) &nbsp;|&nbsp; OK: تشغيل / إيقاف &nbsp;|&nbsp; أعلى / أسفل: القناة أو الحلقة التالية والسابقة &nbsp;|&nbsp; أحمر: نسبة العرض &nbsp;|&nbsp; أخضر: الصوت &nbsp;|&nbsp; أصفر: الترجمة &nbsp;|&nbsp; أزرق: القائمة</div>
 </div>
 <div id="plPanel"><div id="plTitle"></div><div id="plBody"></div></div>
</div>

<script>
(function(){

var app=document.getElementById("app");
var modalBg=document.getElementById("modalBg");
var modal=document.getElementById("modal");
var video=document.getElementById("video");

var SERVER="",USER="",PASS="";
var PAGE="home";
var SECTION="";
var CATEGORY_ID="";
var CATEGORY_NAME="";
var CATEGORIES=[];
var CONTENT=[];
var LIVE=[],MOVIES=[],SERIES=[];
var FAVORITES=[],HISTORY=[];
var CURRENT=null;
var CURRENT_TYPE="";
var CURRENT_PAGE=1;
var PAGE_SIZE=12;
var SEARCH="";
var LAST_FOCUS=null,MODAL_OPENER=null,EPISODES=[];
var SPROG={},PANEL="",LIST_KIND="";
var DINFO=null,DSEASON=0,SEASONS=[],DERR=false,LISTS_DIRTY=false,OPENER_IDX=-1;
var TMDB_KEY="",DCAST=null,CASTCACHE={};
var RADIO_NONE=false;
var SEEK_LADDER=[5,10,20,60,120,300];
var seekCount=0,scanDir=0,seekTarget=null,seekTimer=null;
var SCAN_TICK=1000;
var osdTimer=null,popTimer=null,lastPosSave=0,POS={};
var PLAYER={live:false,key:"",epIndex:-1,liveId:""};
var ASPECTS=[["contain","الأصلي"],["cover","ملء الشاشة (قص)"],["fill","تمديد"]];
var aspectIndex=0;
var requestToken=0;
 var RENDERED_ITEMS={};
var RENDERED_COUNTER=0;
var connected=false;
var BackKey=461;

function $(id){return document.getElementById(id)}

function esc(s){
 return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
 });
}

function loadSaved(){
 try{
  FAVORITES=JSON.parse(localStorage.getItem("mora_favorites")||"[]");
  HISTORY=JSON.parse(localStorage.getItem("mora_history")||"[]");
 }catch(e){FAVORITES=[];HISTORY=[]}
}

function saveLists(){
 LISTS_DIRTY=true;
 try{
  localStorage.setItem("mora_favorites",JSON.stringify(FAVORITES));
  localStorage.setItem("mora_history",JSON.stringify(HISTORY));
 }catch(e){}
}

function credentialsSaved(){
 try{
  SERVER=localStorage.getItem("mora_server")||"";
  USER=localStorage.getItem("mora_user")||"";
  PASS=localStorage.getItem("mora_pass")||"";
 }catch(e){}
}

function apiUrl(action,extra){
 var url=SERVER.replace(/\/+$/,"");
 return url+"/player_api.php?username="+encodeURIComponent(USER)+
 "&password="+encodeURIComponent(PASS)+(action?"&action="+action:"")+(extra||"");
}

function request(url,callback){
 var xhr=new XMLHttpRequest();
 xhr.open("GET",url,true);
 xhr.timeout=20000;
 xhr.onreadystatechange=function(){
  if(xhr.readyState===4){
   if(xhr.status>=200&&xhr.status<300){
    try{callback(null,JSON.parse(xhr.responseText))}
    catch(e){callback("استجابة غير مفهومة من السيرفر")}
   }else callback("تعذر الاتصال بالسيرفر ("+xhr.status+")");
  }
 };
 xhr.onerror=function(){callback("حدث خطأ في الاتصال")};
 xhr.ontimeout=function(){callback("انتهت مهلة الاتصال")};
 xhr.send();
}

function showLogin(error){
 connected=false;
 app.innerHTML='<div class="login-wrap"><div class="login">'+
 '<h1>MORA IPTV</h1><p>YOUR ENTERTAINMENT WORLD</p>'+
 '<div class="field"><label>Server URL</label><input id="serverInput" placeholder="http://example.com:8080" value="'+esc(SERVER)+'"></div>'+
 '<div class="field"><label>Username</label><input id="userInput" value="'+esc(USER)+'"></div>'+
 '<div class="field"><label>Password</label><input id="passInput" type="password" value="'+esc(PASS)+'"></div>'+
 '<button class="primary" onclick="connect()">اتصال بالسيرفر</button>'+
 '<div id="message">'+esc(error||"أدخل بيانات اشتراك Xtream Codes")+'</div></div></div>';
}

function connect(){
 var s=$("serverInput"),u=$("userInput"),p=$("passInput");
 if(s){SERVER=s.value.replace(/\/+$/,"");USER=u.value;PASS=p.value}
 if(!SERVER||!USER||!PASS){showLogin("من فضلك أدخل جميع البيانات");return}
 if($("message"))$("message").innerHTML="جاري الاتصال...";
 request(apiUrl(""),function(err,data){
  if(err||!data||!data.user_info||Number(data.user_info.auth)!==1){
   showLogin(err||"بيانات الاشتراك غير صحيحة");return;
  }
  try{
   localStorage.setItem("mora_server",SERVER);
   localStorage.setItem("mora_user",USER);
   localStorage.setItem("mora_pass",PASS);
  }catch(e){}
  connected=true;
  PAGE="home";
  render();
 });
}

function headerCur(){
 return (PAGE==="categories"||PAGE==="content"||PAGE==="list")?SECTION:PAGE;
}
function headerHTML(){
 var nav=[
  ["home","الرئيسية"],["movies","الأفلام"],["series","المسلسلات"],["live","القنوات"],
  ["radio","الراديو"],["settings","الإعدادات"]
 ];
 var h='<div class="header"><div class="logo">MORA IPTV<small>YOUR ENTERTAINMENT WORLD</small></div><div class="nav">';
 for(var i=0;i<nav.length;i++){
  h+='<button class="'+(headerCur()===nav[i][0]?"active":"")+'" onclick="goPage(\''+nav[i][0]+'\')">'+nav[i][1]+'</button>';
 }
 return h+'</div></div>';
}

/* ================= الصفحة الرئيسية ================= */
function homeTile(id,label,ic,cls,page,f){
 return '<button class="hm-tile" '+(f?'data-f="'+f+'" ':'')+'onclick="goPage(\''+page+'\')">'+
  '<span class="hm-ic '+cls+'">'+icon(ic,100)+'</span>'+esc(label)+'</button>';
}
function drawHomeCards(list,limit){
 if(!list||!list.length)return '<div class="hm-empty">لا يوجد محتوى هنا بعد</div>';
 var count=Math.min(list.length,limit||8);
 var h='<div class="hm-cards">';
 for(var i=0;i<count;i++){
  var x=list[i],t="movie";
  if(x.data){t=x.type||t;x=x.data}
  t=realType(x,t);
  var name=x.name||x.title||"بدون اسم";
  RENDERED_COUNTER++;
  var key="mora_item_"+RENDERED_COUNTER;
  RENDERED_ITEMS[key]={item:x,type:t};
  var rn=Number(x.rating);
  h+='<div class="hcard" tabindex="0" data-item-key="'+key+'" onclick="openRenderedItem(this.getAttribute(\'data-item-key\'))">'+
   '<div class="hcard-n">'+esc(name)+'</div>'+
   '<div class="hcard-f"><span>'+typeLabel(x,t)+'</span>'+(rn>0?'<b>&#9733; '+(Math.round(rn*10)/10)+'</b>':'')+'</div></div>';
 }
 return h+'</div>';
}
function homeHTML(){
 return '<div class="hm">'+
  '<div class="hm-top">'+
   '<div class="hm-tools">'+icon("search",36)+icon("wifi",36)+icon("gear",36)+icon("bell",36)+
   '<span id="hmTime"></span><i class="hm-sep"></i><span class="hm-date" id="hmDate"></span></div>'+
   '<div class="hm-logo">MORA IPTV</div>'+
  '</div>'+
  '<div class="hm-banner"><h1 class="hm-bt">بوابتك لعالم من الترفيه بلا حدود</h1>'+
   '<p class="hm-bs">استمتع بأحدث الأفلام والمسلسلات والقنوات في مكان واحد</p>'+
   '<button class="hm-watch" onclick="goPage(\'movies\')">شاهد الآن</button>'+
   '<div class="hm-dots"><i></i><i></i><i></i><i class="on"></i></div></div>'+
  '<div class="hm-tiles">'+
   homeTile("set","الإعدادات","gear","c-set","settings")+
   homeTile("radio","الراديو","radio","c-radio","radio")+
   homeTile("live","القنوات","tv","c-live","live")+
   homeTile("series","المسلسلات","clapper","c-series","series")+
   homeTile("movies","الأفلام","reel","c-movies","movies")+
   homeTile("home","الرئيسية","home","c-home","home","home")+
  '</div>'+
  '<div class="hm-sec">تابع المشاهدة</div>'+drawHomeCards(HISTORY,8)+
  '<div class="hm-sec">المفضلة</div>'+drawHomeCards(FAVORITES,8)+
 '</div>';
}
function updateHomeClock(){
 var a=$("hmTime"),b=$("hmDate");
 if(!a||!b)return;
 var n=new Date(),h=n.getHours(),ap=h>=12?"PM":"AM";
 h=h%12;if(h===0)h=12;
 a.innerHTML=h+":"+p2(n.getMinutes())+" "+ap;
 b.innerHTML=DAYS[n.getDay()]+"، "+n.getDate()+" "+MONTHS[n.getMonth()]+" "+n.getFullYear();
}

function render(){
 RENDERED_ITEMS={};RENDERED_COUNTER=0;
 if(!connected){showLogin();return}
 if(PAGE==="home"){
  app.innerHTML=homeHTML();
  updateHomeClock();
  var ht=app.querySelector('[data-f="home"]');
  if(ht)try{ht.focus()}catch(e){}
  return;
 }
 var html="";
 if(PAGE==="categories"){
  html=renderCategories();
 }
 else if(PAGE==="content"){
  html=renderContent();
 }
 else if(PAGE==="list"){
  html=renderList();
 }
 else if(PAGE==="settings"){
  html='<h2 class="section-title">الإعدادات</h2><div class="notice">بيانات الاشتراك محفوظة على هذا الجهاز.</div>'+
  '<div class="notice">سيرفر IPTV بيرجّع أسماء الممثلين بس. لعرض صورهم: اعمل حساب مجاني على themoviedb.org، وخد API Key (v3) من Settings ثم API، والصقه هنا.</div>'+
  '<div class="field"><label>مفتاح TMDB لصور الممثلين (اختياري)</label><input id="tmdbInput" value="'+esc(TMDB_KEY)+'" placeholder="32 حرف" style="max-width:420px"></div>'+
  '<button class="primary" onclick="saveTmdbKey()">حفظ المفتاح</button> '+
  '<button class="secondary" onclick="logout()">تغيير الاشتراك / تسجيل الخروج</button>';
 }
 app.innerHTML=headerHTML()+'<div class="page">'+html+'</div>';
}

function drawItems(list,type,limit){
 if(!list||!list.length)
  return '<div class="empty">لا يوجد محتوى للعرض</div>';

 var count=Math.min(list.length,limit||12);
 var h='<div class="grid">';

 for(var i=0;i<count;i++){
  var x=list[i];
  var t=type;
  if(x.data){t=x.type||type;x=x.data}
  t=realType(x,t);
  var name=x.name||x.title||"بدون اسم";
  var img=x.stream_icon||x.cover||x.movie_image||x.backdrop_path||"";

  RENDERED_COUNTER++;
  var key="mora_item_"+RENDERED_COUNTER;
  RENDERED_ITEMS[key]={item:x,type:t};

  h+='<div class="item" tabindex="0" '+
  'data-item-key="'+key+'" '+
  'onclick="openRenderedItem(this.getAttribute(\'data-item-key\'))">'+
  '<img class="poster" src="'+esc(img)+'" '+
  'onerror="this.style.display=\'none\'">'+
  (isWatchedItem(x,t)?'<div class="wbadge">'+icon("check",18)+'</div>':'')+
  '<div class="item-info">'+
  '<div class="item-name">'+esc(name)+'</div>'+
  '<div class="item-type">'+
  typeLabel(x,t)+
'</div></div></div>';
 }

 h+='</div>';
 return h;
}
 
function itemId(item){
 return String(item.stream_id||item.series_id||item.id||"");
}

function goPage(page){
 SEARCH="";
 requestToken++;
 if(page==="live"||page==="movies"||page==="series"||page==="radio"){
  SECTION=page;
  PAGE="categories";
  CATEGORY_ID="";
  CATEGORY_NAME="";
  CATEGORIES=[];
  loadCategories();
  return;
 }
 PAGE=page;
 render();
}

function loadCategories(){
 var action=(SECTION==="live"||SECTION==="radio")?"get_live_categories":
 SECTION==="movies"?"get_vod_categories":"get_series_categories";
 app.innerHTML=headerHTML()+'<div class="page"><div class="empty">جاري تحميل التصنيفات...</div></div>';
 var token=++requestToken;
 request(apiUrl(action),function(err,data){
  if(token!==requestToken)return;
  if(err||!Array.isArray(data)){
   app.innerHTML=headerHTML()+'<div class="page"><div class="empty">'+esc(err||"لم يتم العثور على التصنيفات")+'</div><button class="secondary" onclick="loadCategories()">إعادة المحاولة</button></div>';
   return;
  }
  CATEGORIES=data;
  if(SECTION==="radio"){
   var re=/radio|راديو|رادیو|إذاعة|اذاعة|إذاعات|اذاعات|\bfm\b|قرآن|قران|quran/i,f=[];
   for(var i=0;i<data.length;i++){
    if(re.test(String(data[i].category_name||"")))f.push(data[i]);
   }
   RADIO_NONE=!f.length;
   CATEGORIES=f.length?f:data;
  }
  render();
 });
}

function renderCategories(){
 var title=SECTION==="live"?"القنوات":SECTION==="radio"?"الراديو":SECTION==="movies"?"الأفلام":"المسلسلات";
 var h='<h2 class="section-title">'+title+' - اختر التصنيف</h2>';
 h+='<div class="category-list">';
 if(SECTION==="radio"&&RADIO_NONE)h+='<div class="notice">لم أجد تصنيفًا للراديو في السيرفر، دي كل تصنيفات القنوات.</div>';
 h+='<button class="category special" onclick="openList(\'favorites\')">المفضلة ('+listFor("favorites").length+')</button>';
 h+='<button class="category special" onclick="openList(\'history\')">تابع المشاهدة ('+listFor("history").length+')</button>';
 if(SECTION!=="radio")h+='<button class="category" onclick="chooseCategory(\'\',\'جميع '+title+'\')">جميع '+title+'</button>';
 for(var i=0;i<CATEGORIES.length;i++){
  var c=CATEGORIES[i];
  h+='<button class="category" onclick="chooseCategory(\''+esc(c.category_id)+'\',\''+esc(c.category_name)+'\')">'+esc(c.category_name)+'</button>';
 }
 h+='</div>';
 return h;
}

function chooseCategory(id,name){
 CATEGORY_ID=id;
 CATEGORY_NAME=name;
 CURRENT_PAGE=1;
 SEARCH="";
 PAGE="content";
 loadCategoryContent();
}

function loadCategoryContent(){
 var token=++requestToken;
 app.innerHTML=headerHTML()+'<div class="page"><div class="empty">جاري تحميل '+esc(CATEGORY_NAME)+'...</div></div>';
 var action=(SECTION==="live"||SECTION==="radio")?"get_live_streams":
 SECTION==="movies"?"get_vod_streams":"get_series";
 var extra=CATEGORY_ID?"&category_id="+encodeURIComponent(CATEGORY_ID):"";
 request(apiUrl(action,extra),function(err,data){
  if(token!==requestToken)return;
  if(err||!Array.isArray(data)){
   CONTENT=[];
   render();
   return;
  }
  CONTENT=data;
  if(SECTION==="live"||SECTION==="radio")LIVE=data;
  else if(SECTION==="movies")MOVIES=data;
  else SERIES=data;
  render();
 });
}

function renderContent(){
 var filtered=CONTENT;
 if(SEARCH){
  filtered=[];
  for(var i=0;i<CONTENT.length;i++){
   var n=String(CONTENT[i].name||CONTENT[i].title||"").toLowerCase();
   if(n.indexOf(SEARCH.toLowerCase())>=0)filtered.push(CONTENT[i]);
  }
 }
 var total=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
 if(CURRENT_PAGE>total)CURRENT_PAGE=total;
 var start=(CURRENT_PAGE-1)*PAGE_SIZE;
 var pageItems=filtered.slice(start,start+PAGE_SIZE);
 var type=sectionType();
 var h='<div class="toolbar"><div class="toolbar-group">'+
 '<button class="secondary" onclick="previousPage()">السابق</button>'+
 '<span class="page-count">صفحة '+CURRENT_PAGE+' من '+total+'</span>'+
 '<button class="secondary" onclick="nextPage()">التالي</button></div>'+
 '<div class="toolbar-group"><input id="searchInput" placeholder="بحث في التصنيف..." value="'+esc(SEARCH)+'" onkeydown="if(event.keyCode===13)doSearch()">'+
 '<button class="secondary" onclick="doSearch()">بحث</button>'+
 '<button class="secondary" onclick="goPage(\'home\')">الرئيسية</button>'+
 '<button class="secondary" onclick="loadCategoryContent()">تحديث</button>'+
 '<button class="secondary" onclick="backCategories()">التصنيفات</button></div></div>';
 h+='<h2 class="section-title">'+esc(CATEGORY_NAME)+'</h2>';
 h+=pageItems.length?drawItems(pageItems,type,12):'<div class="empty">لا توجد نتائج في هذا التصنيف</div>';
 return h;
}

function previousPage(){
 if(CURRENT_PAGE>1){CURRENT_PAGE--;render()}
}
function nextPage(){

   }

  });
 }

function buildEpisodes(data){
 EPISODES=[];SEASONS=[];
 for(var season in data.episodes){
  var eps=data.episodes[season]||[];
  var first=EPISODES.length;
  for(var i=0;i<eps.length;i++){
   var ep=eps[i],inf=ep.info||{};
   var etitle=ep.title||ep.name||("الحلقة "+(i+1));
   var num=(ep.episode_num!=null&&ep.episode_num!=="")?ep.episode_num:(i+1);
   EPISODES.push({id:ep.id,ext:ep.container_extension||"mp4",title:etitle,season:season,num:num,img:inf.movie_image||""});
  }
  if(EPISODES.length>first)SEASONS.push({key:season,first:first,last:EPISODES.length-1});
 }
}

  buildEpisodes(data);
  DINFO=(data.info&&typeof data.info==="object")?data.info:{};
  loadCast();

  if(sp){

function playEpisodeById(id,ext,title,fresh){
 var url=SERVER+"/series/"+encodeURIComponent(USER)+"/"+encodeURIComponent(PASS)+"/"+encodeURIComponent(id)+"."+ext;
 var epIdx=-1,ep=null;
 for(var k=0;k<EPISODES.length;k++){
  if(String(EPISODES[k].id)===String(id)){epIdx=k;ep=EPISODES[k];break}
 }
 var sItem=(CURRENT&&CURRENT.type==="series")?CURRENT.item:null;
 var heading=title,sub=title;
 if(sItem){
  var skey=String(sItem.series_id);
  var season=ep?ep.season:"",num=ep?ep.num:"";
  var prev=SPROG[skey];
  if(!ep&&prev&&String(prev.id)===String(id)){season=prev.season;num=prev.num}
  var sname=sItem.name||sItem.title||"";
  heading=sname+(season!==""?" - الموسم "+season:"");
  sub="مسلسل"+(season!==""?" - الموسم "+season:"")+(num!==""?" - الحلقة "+num+": ":" - ")+title;
  SPROG[skey]={id:id,ext:ext,title:title,season:season,num:num};
  saveSprog();
  addHistory(sItem,"series");
 }
 startPlayer(url,title,{key:"ep_"+id,epIndex:epIdx,heading:heading,sub:sub,fresh:!!fresh});
}

function playCurrent(fresh){
 if(!CURRENT)return;
 fresh=(fresh===true);
 var item=CURRENT.item,type=CURRENT.type;
 if(type==="series"){
  var go=function(){
   var sp=fresh?null:SPROG[String(item.series_id)];
   if(sp){playEpisodeById(sp.id,sp.ext,sp.title);return}
   if(EPISODES.length){playEpisodeIndex(0,fresh);return}
   alert("لا توجد حلقات");
  };
  if(EPISODES.length){go();return}
  request(apiUrl("get_series_info","&series_id="+encodeURIComponent(item.series_id)),function(err,data){
   if(err||!data||!data.episodes){alert("تعذر تحميل الحلقات");return}
   if(!isCurrentSeries(item.series_id))return;
   buildEpisodes(data);
   go();
  });
  return;
 }
 var ext=item.container_extension||(type==="live"?"ts":"mp4");
 var folder=type==="live"?"live":"movie";
 var url=SERVER+"/"+folder+"/"+encodeURIComponent(USER)+"/"+encodeURIComponent(PASS)+"/"+encodeURIComponent(item.stream_id)+"."+ext;
 addHistory(item,type);

 startPlayer(url,nm,{

function rememberPos(force){
 if(!PLAYER.key||PLAYER.live)return;
 var d=video.duration;
 if(!d||!isFinite(d))return;
 var now=Date.now();
 if(!force&&now-lastPosSave<5000)return;
 lastPosSave=now;
 var t=video.currentTime;
 if(t<30||t>d-30)return;
 POS[PLAYER.key]={p:Math.floor(t),d:Math.round(d),t:now};
 var keys=[],k;
 for(k in POS)if(!POS[k].done)keys.push(k);
 if(keys.length>150){
  keys.sort(function(a,b){return POS[a].t-POS[b].t});
  for(var i=0;i<keys.length-150;i++)delete POS[keys[i]];
 }
 savePos();
}

   (5 > 10 > 20 > 60 > 120 > 300) ويفضل المسح شغال لحد ما تضغط تشغيل (OK). */
function stepSeek(dir){
 showOsd();
 var d=video.duration;
 if(PLAYER.live||!d||!isFinite(d)){flashInfo("التقديم غير متاح في البث المباشر");return}
 if(scanDir===dir){
  if(seekCount<SEEK_LADDER.length-1)seekCount++;
 }else{
  seekCount=0;
  scanDir=dir;
  if(seekTarget===null)seekTarget=video.currentTime;
  if(!video.paused)video.pause();
 }
 flashHTML(icon(dir>0?"ff":"rew",44)+"<span>"+(dir>0?"+":"-")+fmtStep(SEEK_LADDER[seekCount])+"</span>",36000000);
 syncState();
 clearInterval(seekTimer);
 scanTick();
 if(scanDir!==0)seekTimer=setInterval(scanTick,SCAN_TICK);
}
function scanTick(){
 if(scanDir===0)return;
 var d=video.duration;
 if(!d||!isFinite(d)){stopScan(true);return}
 var t=seekTarget+scanDir*SEEK_LADDER[seekCount];
 var edge=false;
 if(t<=0){t=0;edge=true}
 if(t>=d-1){t=d-1;edge=true}
 seekTarget=t;
 if(!video.seeking){try{video.currentTime=t}catch(e){}}
 updateTime();
 if(edge)stopScan(true);
}
function cancelScan(){
 clearInterval(seekTimer);
 seekTimer=null;
 scanDir=0;seekTarget=null;seekCount=0;
 hidePop();
}
function stopScan(resume){
 if(scanDir===0)return;
 var t=seekTarget;
 cancelScan();
 if(t!==null){try{video.currentTime=t}catch(e){}}
 if(resume){
  try{var pr=video.play();if(pr&&pr.catch)pr.catch(function(){})}catch(e){}
 }
 syncState();
 updateTime();
 showOsd();
}

 var r=$("barWrap").getBoundingClientRect();
 var pct=(ev.clientX-r.left)/r.width;
 if(pct<0)pct=0;if(pct>1)pct=1;
 try{video.currentTime=pct*d}catch(e){}
 showOsd();
}

function cycleAudio(){

 var cur=0;
 for(i=0;i<tr.length;i++)if(tr[i].enabled){cur=i;break}
 var n=(cur+1)%tr.length;
 for(i=0;i<tr.length;i++)tr[i].enabled=false;
 tr[n].enabled=true;

}
function cycleSubs(){

 if(!list.length){flashInfo("لا توجد ترجمة متاحة");return}
 var cur=-1;
 for(i=0;i<list.length;i++)if(list[i].mode==="showing"){cur=i;break}
 for(i=0;i<list.length;i++)list[i].mode="disabled";
 var n=cur+1;
 if(n>=list.length){flashInfo("الترجمة: إيقاف");return}
 list[n].mode="showing";
 flashInfo("الترجمة: "+(list[n].label||list[n].language||(n+1)));
}

function updateTime(){
 if($("playerLayer").style.display!=="flex")return;
 var d=video.duration;
 var known=!PLAYER.live&&d&&isFinite(d);
 var t=seekTarget!==null?seekTarget:video.currentTime;
 updateClock();
 var pct=0,buf=0;
 if(known){
  pct=Math.max(0,Math.min(100,t/d*100));
  try{
   var b=video.buffered;
   for(var i=0;i<b.length;i++){
    if(video.currentTime>=b.start(i)&&video.currentTime<=b.end(i)+0.5){buf=b.end(i)/d*100;break}
   }
  }catch(e){}
 }else if(PLAYER.live){pct=100}
 $("barPos").style.width=pct+"%";
 $("barBuf").style.width=Math.min(100,buf)+"%";
 $("barKnob").style.left=pct+"%";
 $("barKnob").style.display=PLAYER.live?"none":"block";
 $("barWrap").className="bar"+(seekTarget!==null?" seeking":"");
 $("timeCur").innerHTML=PLAYER.live?"مباشر":formatTime(t);

 showOsd();
 var d=video.duration;
 if(PLAYER.live||!d||!isFinite(d)){flashInfo("التقديم غير متاح في البث المباشر");return}
 if(scanDir!==0)stopScan(false);
 var t=Math.max(0,Math.min(d-1,video.currentTime+sec));
 try{video.currentTime=t}catch(e){}
 flashHTML(icon(sec>0?"fwd10":"back10",52),1200);
}

function audioLabel(){
 var tr=video.audioTracks;
 if(!tr||tr.length<2)return "غير متاح";
 for(var i=0;i<tr.length;i++)if(tr[i].enabled)return tr[i].label||tr[i].language||String(i+1);
 return "تلقائي";
}
function subsList(){
 var tt=video.textTracks,list=[];
 if(tt)for(var i=0;i<tt.length;i++)if(tt[i].kind==="subtitles"||tt[i].kind==="captions")list.push(tt[i]);
 return list;
}
function subsLabel(){
 var l=subsList();
 if(!l.length)return "غير متاح";
 for(var i=0;i<l.length;i++)if(l[i].mode==="showing")return l[i].label||l[i].language||String(i+1);
 return "إيقاف";
}
function panelItem(label,onclick,cur){
 return '<div class="pl-item'+(cur?" cur":"")+'" tabindex="0" onclick="'+onclick+'">'+esc(label)+'</div>';
}
function openPanel(kind,focusIdx){
 showOsd();
 var title="",h="",idx=0,i;
 if(kind==="list"){
  if(PLAYER.live){
   var cur=liveIndex();
   if(cur<0){flashInfo("لا توجد قائمة قنوات");return}
   title="القنوات";
   var a=Math.max(0,cur-30),b=Math.min(LIVE.length,cur+60);
   for(i=a;i<b;i++)h+=panelItem(LIVE[i].name||"قناة","zapTo("+i+");closePanel()",i===cur);
   idx=cur-a;
  }else if(PLAYER.epIndex>=0&&EPISODES.length){
   title="الحلقات";
   for(i=0;i<EPISODES.length;i++){
    var ep=EPISODES[i];
    var lbl=(ep.season!==""?"الموسم "+ep.season+" - ":"")+(ep.num!==""?"الحلقة "+ep.num+": ":"")+ep.title;
    h+=panelItem(lbl,"playEpisodeIndex("+i+");closePanel()",i===PLAYER.epIndex);
   }
   idx=PLAYER.epIndex;
  }else{flashInfo("لا توجد قائمة لهذا المحتوى");return}
 }else if(kind==="settings"){
  title="الإعدادات";
  h=panelItem("نسبة العرض: "+ASPECTS[aspectIndex][1],"cycleAspect();refreshPanel()")+
    panelItem("مسار الصوت: "+audioLabel(),"cycleAudio();refreshPanel()")+
    panelItem("الترجمة: "+subsLabel(),"cycleSubs();refreshPanel()");
 }else return;
 if(focusIdx!=null)idx=focusIdx;
 PANEL=kind;
 $("plTitle").innerHTML=esc(title);
 $("plBody").innerHTML=h;
 $("plPanel").style.display="block";
 var items=$("plBody").querySelectorAll(".pl-item");
 if(items[idx])try{items[idx].focus()}catch(e){}
}
function refreshPanel(){
 var items=$("plBody").querySelectorAll(".pl-item"),ai=0;
 for(var i=0;i<items.length;i++)if(items[i]===document.activeElement)ai=i;
 openPanel(PANEL,ai);
}
function closePanel(){
 PANEL="";
 $("plPanel").style.display="none";
}

function onMeta(){
 if(PLAYER.live||!PLAYER.key)return;
 var r=POS[PLAYER.key],d=video.duration;
 if(r&&r.p>30&&d&&isFinite(d)&&r.p<d-30){
  try{video.currentTime=r.p}catch(e){}
  flashInfo("استكمال من "+formatTime(r.p),2200);
 }
}
function onEnded(){
 if(PLAYER.key){POS[PLAYER.key]={p:0,d:Math.round(video.duration)||0,t:Date.now(),done:1};savePos()}
 PLAYER.key="";
 if(PLAYER.epIndex>=0&&EPISODES[PLAYER.epIndex+1]){
  playEpisodeIndex(PLAYER.epIndex+1);
  flashInfo("الحلقة التالية...",2000);
  return;
 }
 closePlayer();
}
function onError(){
 if($("playerLayer").style.display!=="flex"||!video.getAttribute("src"))return;
 setBuffering(false);
 var c=video.error?video.error.code:0;
 flashInfo("تعذر تشغيل هذا الفيديو"+(c?" (خطأ "+c+")":""),3500);
 showOsd();
}

video.addEventListener("timeupdate",function(){updateTime();rememberPos(false)});
video.addEventListener("loadedmetadata",onMeta);
video.addEventListener("waiting",function(){setBuffering(true)});
video.addEventListener("seeking",function(){if(scanDir===0)setBuffering(true)});
video.addEventListener("playing",function(){setBuffering(false);syncState()});
video.addEventListener("canplay",function(){setBuffering(false)});
video.addEventListener("seeked",function(){setBuffering(false)});
video.addEventListener("play",function(){syncState();showOsd()});
video.addEventListener("pause",function(){syncState();showOsd()});
video.addEventListener("error",onError);
video.addEventListener("ended",onEnded);

function keyIs(e,codes,names){
 var k=e.keyCode||e.which,i;
 for(i=0;i<codes.length;i++)if(k===codes[i])return true;
 for(i=0;i<names.length;i++)if(e.key===names[i])return true;
 return false;
}
function isBack(e){
 var k=e.keyCode||e.which;
 var tag=document.activeElement&&document.activeElement.tagName;
 if(k===8)return tag!=="INPUT"&&tag!=="TEXTAREA";
 return k===27||k===BackKey||k===10009||e.key==="GoBack"||e.key==="BrowserBack";
}

document.addEventListener("keydown",function(e){

 var key=e.keyCode||e.which;
 var playerOpen=$("playerLayer").style.display==="flex";
 var modalOpen=modalBg.style.display==="flex";

 if($("trailerLayer").style.display==="block"){
  if(isBack(e)){closeTrailer();e.preventDefault()}
  return;
 }

 if(playerOpen){
  showOsd();
  if(PANEL){
   var pitems=$("plBody").querySelectorAll(".pl-item"),pai=-1,pi;
   for(pi=0;pi<pitems.length;pi++)if(pitems[pi]===document.activeElement)pai=pi;
   if(isBack(e)||keyIs(e,[406],[])){closePanel();e.preventDefault();return}
   if(key===38){var up=pitems[pai>0?pai-1:0];if(up)up.focus();e.preventDefault();return}
   if(key===40){var dn=pitems[pai<pitems.length-1?pai+1:pitems.length-1];if(dn)dn.focus();e.preventDefault();return}
   if(key===13||key===23){if(pai>=0)pitems[pai].click();e.preventDefault();return}
   e.preventDefault();
   return;
  }
  if(isBack(e)||keyIs(e,[413,178],["MediaStop"])){closePlayer();e.preventDefault();return}
  if(key===37||keyIs(e,[412,227,89],["MediaRewind"])){stepSeek(-1);e.preventDefault();return}
  if(key===39||keyIs(e,[417,228,90],["MediaFastForward"])){stepSeek(1);e.preventDefault();return}
  if(key===38){nextItem(1);e.preventDefault();return}
  if(key===40){nextItem(-1);e.preventDefault();return}
  if(key===13||key===23||keyIs(e,[179],["MediaPlayPause"])){togglePlay();e.preventDefault();return}
  if(keyIs(e,[415],["MediaPlay"])){if(video.paused)togglePlay();e.preventDefault();return}
  if(keyIs(e,[19],["MediaPause"])){if(scanDir!==0)stopScan(false);else if(!video.paused)togglePlay();e.preventDefault();return}
  if(keyIs(e,[427,34],["MediaTrackNext","ChannelUp","PageDown"])){nextItem(1);e.preventDefault();return}
  if(keyIs(e,[428,33],["MediaTrackPrevious","ChannelDown","PageUp"])){nextItem(-1);e.preventDefault();return}
  if(keyIs(e,[403,65],[])){cycleAspect();e.preventDefault();return}
  if(keyIs(e,[404],[])){cycleAudio();e.preventDefault();return}
  if(keyIs(e,[405],[])){cycleSubs();e.preventDefault();return}
  if(keyIs(e,[406],[])){openPanel("list");e.preventDefault();return}
  if(keyIs(e,[457,73],["Info"])){openPanel("settings");e.preventDefault();return}
  flashInfo("KEY "+key+(e.key?" ("+e.key+")":""),1200);
  return;
 }

 var active=document.activeElement;
 var cls=active&&active.className?String(active.className):"";

 if(key===13||key===23){
  if(modalOpen&&active&&active!==modal&&modal.contains(active)&&active.click){
   e.preventDefault();
   active.click();
   return;
  }
  if(!modalOpen&&(cls.indexOf("item")!==-1||cls.indexOf("hcard")!==-1)){
   var itemKey=active.getAttribute("data-item-key");
   if(itemKey){
    e.preventDefault();
    openRenderedItem(itemKey);
    return;
   }
  }
 }

 if(modalOpen){
  if(isBack(e)){closeModal();e.preventDefault();return}
  if(key>=37&&key<=40){detailsNav(key);e.preventDefault();return}
  if(key===405&&active&&active.getAttribute){
   var af=active.getAttribute("data-f")||"";
   if(af.indexOf("ep-")===0){toggleEpWatched(Number(af.substring(3)));e.preventDefault();return}
  }
  return;
 }

 if(isBack(e)){
  if(PAGE==="content"||PAGE==="list"){backCategories();e.preventDefault();return}
  if(PAGE==="categories"){goPage("home");e.preventDefault();return}
  if(PAGE!=="home"){goPage("home");e.preventDefault()}
 }
},true);

loadSaved();
loadPos();
loadSprog();
try{TMDB_KEY=localStorage.getItem("mora_tmdb")||""}catch(e){}
initIcons();
setInterval(function(){
 if($("playerLayer").style.display==="flex")updateClock();
 if(modalBg.style.display==="flex")updateDetailsClock();
 if(PAGE==="home"&&connected)updateHomeClock();
},15000);
credentialsSaved();
if(SERVER&&USER&&PASS)connect();
else showLogin();

})();
