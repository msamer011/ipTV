<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My TV IPTV</title>
<style>
/* إعدادات عامة */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070b14;color:#fff;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;overflow-x:hidden;direction:rtl}
button,input{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit;outline:none}
a{text-decoration:none;color:inherit}

/* الشريط العلوي */
.header{display:flex;justify-content:space-between;align-items:center;padding:25px 4%;}
.header-icons{display:flex;gap:25px;color:#aab1c0;font-size:22px;align-items:center}
.header-icons svg{width:26px;height:26px;cursor:pointer;transition:0.3s}
.header-icons svg:hover{color:#fff}
.header-time{font-size:18px;color:#aab1c0;margin-right:20px}
.header-logo{font-size:38px;font-weight:bold;color:#f2b01e;letter-spacing:1px;text-shadow:0 0 20px rgba(242,176,30,0.3)}

/* البانر الرئيسي */
.hero{margin:0 4% 30px;border-radius:20px;overflow:hidden;position:relative;display:flex;align-items:center;height:280px;background:linear-gradient(to left, rgba(7,11,20,0.9), rgba(7,11,20,0.2)), url('https://image.tmdb.org/t/p/original/1X7F6g7r7g7g7g7g7g7g7g7g7g7.jpg') center/cover;background-color:#1a2235;}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg, transparent 40%, rgba(7,11,20,0.95) 100%);z-index:1}
.hero-content{position:relative;z-index:2;padding:0 40px;width:100%;text-align:right}
.hero-title{font-size:38px;font-weight:bold;margin-bottom:10px;text-shadow:0 2px 10px #000}
.hero-sub{font-size:18px;color:#ccc;margin-bottom:20px;text-shadow:0 2px 10px #000}
.hero-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);padding:10px 30px;border-radius:30px;font-size:16px;font-weight:bold;backdrop-filter:blur(5px);transition:0.3s}
.hero-btn:hover{background:#f2b01e;color:#000;border-color:#f2b01e}
.hero-dots{position:absolute;bottom:20px;left:40px;display:flex;gap:8px}
.hero-dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.3)}
.hero-dots span.active{background:#fff}

/* صف الأيقونات الرئيسية */
.main-categories{display:flex;justify-content:center;gap:20px;margin:0 4% 40px;flex-wrap:wrap}
.cat-box{background:rgba(20,25,35,0.8);border:1px solid rgba(255,255,255,0.05);border-radius:20px;width:150px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;transition:0.3s;position:relative;overflow:hidden;cursor:pointer}
.cat-box::before{content:'';position:absolute;inset:0;opacity:0.1;transition:0.3s}
.cat-box:hover{transform:translateY(-5px);box-shadow:0 10px 20px rgba(0,0,0,0.5)}
.cat-box.active{border-color:#f2b01e;box-shadow:0 0 20px rgba(242,176,30,0.2)}
.cat-box.active::before{background:#f2b01e;opacity:0.05}
.cat-icon{width:50px;height:50px;display:flex;align-items:center;justify-content:center}
.cat-icon svg{width:100%;height:100%}
.cat-title{font-size:18px;font-weight:bold}
.cat-box.active .cat-icon svg{stroke:#f2b01e;fill:none}
.cat-box[data-type="movies"] .cat-icon svg{stroke:#3b82f6;fill:none}
.cat-box[data-type="series"] .cat-icon svg{stroke:#a855f7;fill:none}
.cat-box[data-type="live"] .cat-icon svg{stroke:#06b6d4;fill:none}
.cat-box[data-type="radio"] .cat-icon svg{stroke:#ec4899;fill:none}
.cat-box[data-type="settings"] .cat-icon svg{stroke:#9ca3af;fill:none}

/* العناوين والصفوف */
.section-title{font-size:24px;font-weight:bold;margin:0 4% 20px;display:flex;justify-content:space-between;align-items:center}
.content-row{display:flex;gap:20px;padding:0 4% 40px;overflow-x:auto;scrollbar-width:none}
.content-row::-webkit-scrollbar{display:none}
.card{position:relative;border-radius:15px;overflow:hidden;width:220px;height:300px;flex-shrink:0;cursor:pointer;transition:0.3s;border:2px solid transparent;background:#141923}
.card:hover,.card:focus{border-color:#f2b01e;transform:scale(1.02);outline:none}
.card img{width:100%;height:100%;object-fit:cover}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 40%, transparent 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:15px}
.card-rating{position:absolute;bottom:15px;right:15px;font-size:14px;font-weight:bold;display:flex;align-items:center;gap:5px;color:#f2b01e;background:rgba(0,0,0,0.6);padding:4px 10px;border-radius:15px}
.card-cat{position:absolute;bottom:15px;left:15px;font-size:13px;color:#ccc}
.card-title{font-size:18px;font-weight:bold;margin-bottom:5px;text-shadow:0 2px 5px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-progress{position:absolute;bottom:0;left:0;right:0;height:5px;background:rgba(255,255,255,0.2)}
.card-progress-fill{height:100%;background:#f2b01e;width:0%}

/* صفحات التصنيفات */
.page-header{padding:20px 4%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #252a36}
.back-btn{display:flex;align-items:center;gap:10px;font-size:18px;background:#252a36;padding:10px 20px;border-radius:10px;cursor:pointer}
.back-btn:hover{background:#353b4a}
.categories-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));gap:20px;padding:30px 4%}
.category-btn{background:#141923;border:1px solid #252d3a;padding:20px;border-radius:12px;font-size:18px;text-align:right;transition:0.3s;cursor:pointer}
.category-btn:hover,.category-btn:focus{background:#252d3a;border-color:#f2b01e;outline:none}

/* شبكة المحتوى */
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));gap:25px;padding:30px 4%}
.grid .card{width:100%;height:330px}

/* نافذة التفاصيل (Modal) */
.modal-bg{position:fixed;inset:0;background:rgba(7,11,20,0.95);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(10px)}
.modal{background:#141923;border:1px solid #252d3a;border-radius:20px;max-width:900px;width:100%;max-height:90vh;overflow-y:auto;position:relative;display:flex;gap:30px;padding:30px}
.modal-close{position:absolute;top:20px;left:20px;background:#252a36;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;z-index:10}
.modal-poster{width:300px;flex-shrink:0;border-radius:15px;overflow:hidden}
.modal-poster img{width:100%;height:auto;display:block;object-fit:cover}
.modal-info{flex:1;display:flex;flex-direction:column}
.modal-title{font-size:32px;font-weight:bold;margin-bottom:15px}
.modal-meta{display:flex;gap:15px;color:#aab1c0;font-size:16px;margin-bottom:20px;flex-wrap:wrap}
.modal-meta .gold{color:#f2b01e;font-weight:bold}
.modal-plot{font-size:16px;line-height:1.7;color:#ccc;margin-bottom:30px}
.modal-actions{display:flex;gap:15px;margin-top:auto;flex-wrap:wrap}
.btn-primary{background:#f2b01e;color:#000;font-weight:bold;padding:15px 30px;border-radius:10px;font-size:18px;display:flex;align-items:center;gap:10px;transition:0.3s}
.btn-primary:hover{background:#d9a94e}
.btn-secondary{background:#252a36;color:#fff;padding:15px 30px;border-radius:10px;font-size:18px;display:flex;align-items:center;gap:10px;transition:0.3s}
.btn-secondary:hover{background:#353b4a}

/* المشغل */
#playerLayer{display:none;position:fixed;inset:0;background:#000;z-index:200;align-items:center;justify-content:center}
#video{width:100%;height:100%;object-fit:contain}
.player-close{position:absolute;top:30px;right:30px;background:rgba(0,0,0,0.6);border:2px solid #fff;color:#fff;width:50px;height:50px;border-radius:50%;font-size:24px;display:flex;align-items:center;justify-content:center;z-index:210;cursor:pointer}
.player-close:hover{background:#f2b01e;color:#000;border-color:#f2b01e}

@media(max-width:768px){
 .modal{flex-direction:column;padding:20px}
 .modal-poster{width:100%;max-width:250px;margin:0 auto}
 .main-categories{gap:10px}
 .cat-box{width:100px;height:100px;border-radius:15px}
 .cat-icon{width:30px;height:30px}
 .cat-title{font-size:14px}
 .hero{height:200px}
 .hero-title{font-size:24px}
 .hero-sub{font-size:14px}
}
</style>
</head>
<body>

<!-- الحاوية الرئيسية التي سيتغير محتواها بناءً على الصفحة -->
<div id="app"></div>

<!-- نافذة التفاصيل -->
<div class="modal-bg" id="modalBg">
 <div class="modal" id="modalContent">
  <div class="modal-close" onclick="closeModal()">✕</div>
  <div class="modal-poster"><img id="modalImg" src="" alt=""></div>
  <div class="modal-info">
   <h1 class="modal-title" id="modalTitle">اسم الفيلم</h1>
   <div class="modal-meta" id="modalMeta"></div>
   <div class="modal-plot" id="modalPlot"></div>
   <div class="modal-actions">
    <button class="btn-primary" onclick="playCurrent()">▶ تشغيل الآن</button>
    <button class="btn-secondary" id="favBtn" onclick="toggleFavorite()">⭐ إضافة للمفضلة</button>
   </div>
  </div>
 </div>
</div>

<!-- المشغل -->
<div id="playerLayer">
 <video id="video" autoplay controls></video>
 <div class="player-close" onclick="closePlayer()">✕</div>
</div>

<script>
// ================= المتغيرات العامة =================
var SERVER="", USER="", PASS="";
var CURRENT_PAGE="home", CURRENT_SECTION="", CURRENT_CATEGORY_ID="", CURRENT_CATEGORY_NAME="";
var CATEGORIES=[], CONTENT=[];
var CURRENT_ITEM=null, CURRENT_TYPE="";
var FAVORITES=[], POSITIONS={};
var RENDERED_ITEMS={}, RENDERED_COUNTER=0;
var app = document.getElementById("app");

// ================= الدوال المساعدة =================
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function apiUrl(action, extra){ return SERVER.replace(/\/+$/, "") + "/player_api.php?username=" + encodeURIComponent(USER) + "&password=" + encodeURIComponent(PASS) + (action ? "&action=" + action : "") + (extra || ""); }

function request(url, callback){
 if(!SERVER || !USER || !PASS){ callback("يرجى إدخال بيانات الاشتراك في الإعدادات"); return; }
 var xhr = new XMLHttpRequest();
 xhr.open("GET", url, true);
 xhr.timeout = 20000;
 xhr.onreadystatechange = function(){
  if(xhr.readyState === 4){
   if(xhr.status >= 200 && xhr.status < 300){ try { callback(null, JSON.parse(xhr.responseText)); } catch(e) { callback("خطأ في الاستجابة"); } }
   else callback("فشل الاتصال (" + xhr.status + ")");
  }
 };
 xhr.onerror = function(){ callback("خطأ في الشبكة"); };
 xhr.ontimeout = function(){ callback("انتهت المهلة"); };
 xhr.send();
}

function updateClock(){
 var now = new Date();
 var time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
 var date = now.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
 var clockEl = $("liveClock"); var dateEl = $("liveDate");
 if(clockEl) clockEl.innerText = time;
 if(dateEl) dateEl.innerText = date;
}
setInterval(updateClock, 1000);

function loadSavedData(){
 try { FAVORITES = JSON.parse(localStorage.getItem("mora_favorites") || "[]"); } catch(e){ FAVORITES = []; }
 try { POSITIONS = JSON.parse(localStorage.getItem("mora_positions") || "{}"); } catch(e){ POSITIONS = {}; }
 try { SERVER = localStorage.getItem("mora_server") || ""; USER = localStorage.getItem("mora_user") || ""; PASS = localStorage.getItem("mora_pass") || ""; } catch(e){}
}
function saveFavorites(){ try { localStorage.setItem("mora_favorites", JSON.stringify(FAVORITES)); } catch(e){} }
function savePositions(){ try { localStorage.setItem("mora_positions", JSON.stringify(POSITIONS)); } catch(e){} }

function isFavorite(item, type){
 var id = String(item.stream_id || item.series_id || item.id);
 for(var i=0; i<FAVORITES.length; i++){ if(String(FAVORITES[i].id) === id && FAVORITES[i].type === type) return true; }
 return false;
}
function getProgress(item, type){
 var id = String(item.stream_id || item.series_id || item.id);
 var p = POSITIONS[type + "_" + id];
 if(p && p.duration > 0 && !p.done) return Math.round((p.position / p.duration) * 100);
 return 0;
}

// ================= بناء الصفحات (Routing) =================
function renderPage(page, section){
 CURRENT_PAGE = page;
 if(section) CURRENT_SECTION = section;

 if(page === "home") renderHome();
 else if(page === "settings") renderSettings();
 else if(page === "categories") renderCategories();
 else if(page === "content") renderContentGrid();
}

// 1. الصفحة الرئيسية
function renderHome(){
 RENDERED_ITEMS = {}; RENDERED_COUNTER = 0;
 var h = `
 <div class="header">
  <div class="header-icons">
   <span id="liveClock">00:00 PM</span>
   <span id="liveDate">جاري التحميل...</span>
   <svg onclick="renderPage('settings')" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0114.08 0"/><path d="M1.42 9a16 16 0 0121.16 0"/><path d="M8.53 16.11a6 6 0 016.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </div>
  <div class="header-logo">My TV</div>
 </div>
 <div class="hero">
  <div class="hero-content">
   <h1 class="hero-title">بوابتك لعالم من الترفيه بلا حدود</h1>
   <p class="hero-sub">استمتع بأحدث الأفلام والمسلسلات والقنوات في مكان واحد</p>
   <button class="hero-btn">شاهد الآن</button>
  </div>
  <div class="hero-dots"><span></span><span></span><span></span><span class="active"></span></div>
 </div>
 <div class="main-categories">
  <div class="cat-box active" data-type="home" onclick="renderPage('home')">
   <div class="cat-icon"><svg viewBox="0 0 24 24" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
   <div class="cat-title">الرئيسية</div>
  </div>
  <div class="cat-box" data-type="movies" onclick="renderPage('categories', 'movies')">
   <div class="cat-icon"><svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>
   <div class="cat-title">الأفلام</div>
  </div>
  <div class="cat-box" data-type="series" onclick="renderPage('categories', 'series')">
   <div class="cat-icon"><svg viewBox="0 0 24 24" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg></div>
   <div class="cat-title">المسلسلات</div>
  </div>
  <div class="cat-box" data-type="live" onclick="renderPage('categories', 'live')">
   <div class="cat-icon"><svg viewBox="0 0 24 24" stroke-width="2"><path d="M4 11a9 9 0 019 9"/><path d="M4 4a16 16 0 0116 16"/><circle cx="5" cy="19" r="1"/></svg></div>
   <div class="cat-title">القنوات</div>
  </div>
  <div class="cat-box" data-type="radio" onclick="alert('قريباً')">
   <div class="cat-icon"><svg viewBox="0 0 24 24" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg></div>
   <div class="cat-title">الراديو</div>
  </div>
  <div class="cat-box" data-type="settings" onclick="renderPage('settings')">
   <div class="cat-icon"><svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg></div>
   <div class="cat-title">الإعدادات</div>
  </div>
 </div>
 <div class="section-title">المحتوى المميز</div>
 <div class="content-row" id="featuredRow"><div style="color:#ccc;">جاري التحميل...</div></div>
 <div class="section-title">أحدث الإضافات</div>
 <div class="content-row" id="latestRow"><div style="color:#ccc;">جاري التحميل...</div></div>
 `;
 app.innerHTML = h;
 updateClock();
 
 // تحميل المحتوى
 if(SERVER && USER && PASS){
  request(apiUrl("get_vod_streams"), function(err, data){
   if(err || !Array.isArray(data)){ 
    if($("featuredRow")) $("featuredRow").innerHTML = '<div style="color:#ff5555;">تعذر التحميل: '+err+'</div>';
    return; 
   }
   var items = data.slice(0, 10);
   var h1 = ""; var h2 = "";
   for(var i=0; i<items.length; i++){
    h1 += buildCard(items[i], "movie");
   }
   var latest = data.slice(-10).reverse();
   for(var j=0; j<latest.length; j++){
    h2 += buildCard(latest[j], "movie");
   }
   if($("featuredRow")) $("featuredRow").innerHTML = h1;
   if($("latestRow")) $("latestRow").innerHTML = h2;
  });
 } else {
  if($("featuredRow")) $("featuredRow").innerHTML = '<div style="color:#f2b01e;">يرجى الذهاب للإعدادات وإدخال بيانات الاشتراك أولاً.</div>';
  if($("latestRow")) $("latestRow").innerHTML = '';
 }
}

// 2. صفحة الإعدادات
function renderSettings(){
 var h = `
 <div class="page-header"><div class="back-btn" onclick="renderPage('home')">← رجوع</div><h2>الإعدادات</h2></div>
 <div style="max-width:500px; margin:50px auto; padding:0 20px;">
  <label style="display:block;margin-bottom:5px;">Server URL</label>
  <input type="text" id="setServer" value="${esc(SERVER)}" style="width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#141923;color:#fff;margin-bottom:15px;">
  <label style="display:block;margin-bottom:5px;">Username</label>
  <input type="text" id="setUser" value="${esc(USER)}" style="width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#141923;color:#fff;margin-bottom:15px;">
  <label style="display:block;margin-bottom:5px;">Password</label>
  <input type="password" id="setPass" value="${esc(PASS)}" style="width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#141923;color:#fff;margin-bottom:25px;">
  <button class="btn-primary" style="width:100%;justify-content:center;" onclick="saveSettings()">حفظ البيانات</button>
 </div>
 `;
 app.innerHTML = h;
}
function saveSettings(){
 SERVER = $("setServer").value.trim(); USER = $("setUser").value.trim(); PASS = $("setPass").value.trim();
 localStorage.setItem("mora_server", SERVER); localStorage.setItem("mora_user", USER); localStorage.setItem("mora_pass", PASS);
 renderPage("home");
}

// 3. صفحة التصنيفات
function renderCategories(){
 var title = CURRENT_SECTION === "live" ? "القنوات" : CURRENT_SECTION === "movies" ? "الأفلام" : "المسلسلات";
 var h = `<div class="page-header"><div class="back-btn" onclick="renderPage('home')">← رجوع</div><h2>تصنيفات ${title}</h2></div><div class="categories-grid" id="catGrid"><div style="padding:20px;color:#ccc;">جاري التحميل...</div></div>`;
 app.innerHTML = h;
 
 var action = CURRENT_SECTION === "live" ? "get_live_categories" : CURRENT_SECTION === "movies" ? "get_vod_categories" : "get_series_categories";
 request(apiUrl(action), function(err, data){
  if(err || !Array.isArray(data)){ $("catGrid").innerHTML = `<div style="color:#ff5555;padding:20px;">${err}</div>`; return; }
  CATEGORIES = data;
  var h = `<button class="category-btn" onclick="loadContent('', 'جميع ${title}')">جميع ${title}</button>`;
  for(var i=0; i<CATEGORIES.length; i++){
   h += `<button class="category-btn" onclick="loadContent('${esc(CATEGORIES[i].category_id)}', '${esc(CATEGORIES[i].category_name)}')">${esc(CATEGORIES[i].category_name)}</button>`;
  }
  $("catGrid").innerHTML = h;
 });
}

// 4. صفحة محتوى التصنيف (الشبكة)
function loadContent(catId, catName){
 CURRENT_CATEGORY_ID = catId; CURRENT_CATEGORY_NAME = catName;
 CURRENT_PAGE = "content";
 var action = CURRENT_SECTION === "live" ? "get_live_streams" : CURRENT_SECTION === "movies" ? "get_vod_streams" : "get_series";
 var extra = catId ? "&category_id=" + encodeURIComponent(catId) : "";
 
 var h = `<div class="page-header"><div class="back-btn" onclick="renderPage('categories')">← التصنيفات</div><h2>${esc(catName)}</h2></div><div class="grid" id="contentGrid"><div style="padding:20px;color:#ccc;">جاري التحميل...</div></div>`;
 app.innerHTML = h;
 
 request(apiUrl(action, extra), function(err, data){
  if(err || !Array.isArray(data)){ $("contentGrid").innerHTML = `<div style="color:#ff5555;padding:20px;">${err}</div>`; return; }
  CONTENT = data;
  renderContentGrid();
 });
}

function renderContentGrid(){
 var grid = $("contentGrid");
 if(!grid) return;
 RENDERED_ITEMS = {}; RENDERED_COUNTER = 0;
 var h = "";
 for(var i=0; i<CONTENT.length; i++){
  h += buildCard(CONTENT[i], CURRENT_SECTION === "live" ? "live" : CURRENT_SECTION === "series" ? "series" : "movie");
 }
 grid.innerHTML = h || '<div style="color:#ccc;padding:20px;">لا يوجد محتوى</div>';
}

// دالة بناء الكارت (تستخدم في الرئيسية والشبكة)
function buildCard(item, type) {
 var img = item.stream_icon || item.cover || "";
 var name = item.name || item.title || "";
 RENDERED_COUNTER++;
 var key = "item_" + RENDERED_COUNTER;
 RENDERED_ITEMS[key] = {item: item, type: type};
 var prog = getProgress(item, type);
 var fav = isFavorite(item, type) ? '<div style="position:absolute;top:10px;right:10px;color:#f2b01e;font-size:24px;z-index:5;text-shadow:0 0 5px #000;">★</div>' : '';
 
 return `<div class="card" tabindex="0" onclick="openDetails('${key}')">
  <img src="${esc(img)}" onerror="this.src='https://via.placeholder.com/220x330/141923/fff?text=No+Image'">
  ${fav}
  <div class="card-overlay"><div class="card-title">${esc(name)}</div></div>
  <div class="card-rating">★ ${(Math.random()*2+7).toFixed(1)}</div>
  <div class="card-cat">${type === 'movie' ? 'فيلم' : type === 'series' ? 'مسلسل' : 'قناة'}</div>
  ${prog > 0 ? `<div class="card-progress"><div class="card-progress-fill" style="width:${prog}%"></div></div>` : ''}
 </div>`;
}

// ================= نافذة التفاصيل =================
function openDetails(key){
 var entry = RENDERED_ITEMS[key];
 if(!entry) return;
 CURRENT_ITEM = entry.item; CURRENT_TYPE = entry.type;
 
 var title = CURRENT_ITEM.name || CURRENT_ITEM.title || "بدون اسم";
 var img = CURRENT_ITEM.stream_icon || CURRENT_ITEM.cover || "";
 var plot = CURRENT_ITEM.plot || CURRENT_ITEM.description || "لا توجد تفاصيل متاحة لهذا المحتوى حالياً.";
 
 $("modalImg").src = img || 'https://via.placeholder.com/300x450/141923/fff?text=No+Image';
 $("modalTitle").innerText = title;
 $("modalMeta").innerHTML = `<span class="gold">★ ${(Math.random()*2+7).toFixed(1)}</span><span>|</span><span>${CURRENT_TYPE === 'series' ? 'مسلسل' : CURRENT_TYPE === 'live' ? 'قناة مباشرة' : 'فيلم'}</span>`;
 $("modalPlot").innerText = plot;
 
 updateFavButton();
 $("modalBg").style.display = "flex";
}
function closeModal(){ $("modalBg").style.display = "none"; }

function updateFavButton(){
 if(isFavorite(CURRENT_ITEM, CURRENT_TYPE)){
  $("favBtn").innerHTML = "★ إزالة من المفضلة"; $("favBtn").style.color = "#f2b01e";
 } else {
  $("favBtn").innerHTML = "⭐ إضافة للمفضلة"; $("favBtn").style.color = "#fff";
 }
}

function toggleFavorite(){
 if(!CURRENT_ITEM) return;
 var id = String(CURRENT_ITEM.stream_id || CURRENT_ITEM.series_id || CURRENT_ITEM.id);
 var found = -1;
 for(var i=0; i<FAVORITES.length; i++){
  if(String(FAVORITES[i].id) === id && FAVORITES[i].type === CURRENT_TYPE){ found = i; break; }
 }
 if(found >= 0) FAVORITES.splice(found, 1);
 else FAVORITES.push({id: id, type: CURRENT_TYPE, name: CURRENT_ITEM.name || CURRENT_ITEM.title});
 saveFavorites();
 updateFavButton();
 
 // تحديث النجمة في الواجهة الخلفية (بدون إغلاق المودال)
 for(var k in RENDERED_ITEMS){
  if(RENDERED_ITEMS[k].item === CURRENT_ITEM){
   var card = document.querySelector(`[onclick="openDetails('${k}')"]`);
   if(card){
    var star = card.querySelector('div[style*="color:#f2b01e"]');
    if(isFavorite(CURRENT_ITEM, CURRENT_TYPE)){
     if(!star){ var d=document.createElement('div'); d.style.cssText='position:absolute;top:10px;right:10px;color:#f2b01e;font-size:24px;z-index:5;text-shadow:0 0 5px #000;'; d.innerText='★'; card.appendChild(d); }
    } else {
     if(star) star.remove();
    }
   }
  }
 }
}

// ================= المشغل =================
function playCurrent(){
 if(!CURRENT_ITEM) return;
 var ext = CURRENT_ITEM.container_extension || (CURRENT_TYPE === "live" ? "ts" : "mp4");
 var folder = CURRENT_TYPE === "live" ? "live" : "movie";
 var url = SERVER + "/" + folder + "/" + encodeURIComponent(USER) + "/" + encodeURIComponent(PASS) + "/" + encodeURIComponent(CURRENT_ITEM.stream_id) + "." + ext;
 
 $("video").src = url;
 $("playerLayer").style.display = "flex";
 closeModal();
 $("video").play().catch(function(e){ alert("تعذر تشغيل الفيديو."); });
}

function closePlayer(){
 var vid = $("video");
 if(CURRENT_ITEM && !vid.paused && vid.currentTime > 0 && vid.duration > 0){
  var id = String(CURRENT_ITEM.stream_id || CURRENT_ITEM.series_id);
  POSITIONS[CURRENT_TYPE + "_" + id] = { position: vid.currentTime, duration: vid.duration, done: false };
  savePositions();
 }
 vid.pause(); vid.removeAttribute("src"); vid.load();
 $("playerLayer").style.display = "none";
 renderPage(CURRENT_PAGE);
}

// ================= التشغيل الأولي =================
loadSavedData();
if(!SERVER || !USER || !PASS){ renderPage("settings"); }
else { renderPage("home"); }

// تصدير الدوال للنطاق العام
window.renderPage = renderPage;
window.loadContent = loadContent;
window.openDetails = openDetails;
window.closeModal = closeModal;
window.toggleFavorite = toggleFavorite;
window.playCurrent = playCurrent;
window.closePlayer = closePlayer;
window.saveSettings = saveSettings;

</script>
</body>
</html>
